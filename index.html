<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Oral — Speech & Language Companion</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;height:100vh;width:100vw}
  #root{height:100vh;width:100vw}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .btn{padding:14px 32px;border:none;border-radius:50px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
  .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 20px rgba(102,126,234,.5)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(102,126,234,.7)}
  .btn-green{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
  .btn-green:hover{transform:translateY(-2px)}
  .btn-orange{background:linear-gradient(135deg,#f7971e,#ffd200);color:#333}
  .btn-sm{padding:8px 20px;font-size:.9rem}
  canvas{display:block}

  /* Welcome */
  .welcome-bg{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .welcome-title{font-size:4rem;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
  .welcome-sub{font-size:1.2rem;color:#a0a0c0;text-align:center;max-width:500px;line-height:1.6}
  .welcome-fish{font-size:3rem;animation:fishsway 2s ease-in-out infinite}
  @keyframes fishsway{0%,100%{transform:translateX(-10px) rotate(-5deg)}50%{transform:translateX(10px) rotate(5deg)}}

  /* Wizard */
  .wizard-wrap{background:linear-gradient(135deg,#0f0c29,#302b63);width:100%;height:100%;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px}
  .wizard-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:40px;max-width:640px;width:100%}
  .wizard-title{font-size:1.8rem;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .wizard-q{font-size:1.1rem;color:#c0c0e0;text-align:center;margin-bottom:24px;line-height:1.5}
  .wizard-option{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:2px solid rgba(255,255,255,.1);margin-bottom:10px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03)}
  .wizard-option:hover,.wizard-option.selected{border-color:#667eea;background:rgba(102,126,234,.15)}
  .wizard-option-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
  .wizard-option-text{font-size:1rem;color:#e0e0f0}
  .level-confirm{text-align:center;margin-top:24px;padding:24px;background:rgba(255,255,255,.05);border-radius:16px;border:1px solid rgba(102,126,234,.3)}
  .level-name{font-size:1.8rem;font-weight:800;color:#f093fb}
  .level-desc{font-size:1rem;color:#a0a0c0;margin:8px 0 16px}
  .level-adj{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
  .adj-btn{width:40px;height:40px;border-radius:50%;border:2px solid #667eea;background:transparent;color:#667eea;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s}
  .adj-btn:hover{background:#667eea;color:#fff}
  .adj-num{font-size:2rem;font-weight:900;color:#fff;min-width:48px;text-align:center}

  /* Talk UI overlay */
  .talk-overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
  .talk-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.4);pointer-events:all;backdrop-filter:blur(6px)}
  .stars-bar{flex:1;max-width:400px;margin:0 auto}
  .stars-label{font-size:.8rem;color:#ffd200;margin-bottom:4px;text-align:center}
  .stars-track{height:12px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
  .stars-fill{height:100%;background:linear-gradient(90deg,#ffd200,#ff6b35);border-radius:6px;transition:width .4s}
  .star-count{font-size:.85rem;color:#ffd200;text-align:center;margin-top:2px}
  .talk-bottom{margin-top:auto;padding:16px;background:rgba(0,0,0,.5);pointer-events:all;backdrop-filter:blur(6px)}
  .input-row{display:flex;gap:10px;align-items:center;max-width:700px;margin:0 auto}
  .text-input{flex:1;padding:12px 18px;border-radius:50px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:1rem;outline:none}
  .text-input:focus{border-color:#667eea}
  .text-input::placeholder{color:rgba(255,255,255,.4)}
  .mic-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4rem;transition:all .2s;flex-shrink:0}
  .mic-idle{background:linear-gradient(135deg,#667eea,#764ba2)}
  .mic-active{background:linear-gradient(135deg,#ff4444,#ff0000);animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .mic-listening-label{font-size:.75rem;color:#ff6666;text-align:center;margin-top:4px;min-height:16px}
  .send-btn{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;font-size:1.4rem;cursor:pointer;flex-shrink:0;transition:all .2s}
  .send-btn:hover{transform:scale(1.05)}
  .icon-btn{background:transparent;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:6px;border-radius:8px;transition:all .2s;opacity:.8}
  .icon-btn:hover{opacity:1;background:rgba(255,255,255,.1)}
  .level-badge{font-size:.75rem;color:#a0a0c0;text-align:center;padding:4px 10px;background:rgba(255,255,255,.08);border-radius:20px;white-space:nowrap}
  .type-toggle{font-size:.7rem;color:#a0a0c0;cursor:pointer;text-decoration:underline;text-align:center;margin-top:4px;background:transparent;border:none;color:#667eea}

  /* Fish game */
  .fish-overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
  .fish-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(0,0,20,.6);pointer-events:all;backdrop-filter:blur(6px)}
  .fish-progress-wrap{flex:1;max-width:400px;margin:0 16px}
  .fish-progress-label{font-size:.85rem;color:#38ef7d;text-align:center;margin-bottom:4px}
  .fish-track{height:14px;background:rgba(255,255,255,.1);border-radius:7px;overflow:hidden}
  .fish-fill{height:100%;background:linear-gradient(90deg,#11998e,#38ef7d);border-radius:7px;transition:width .4s}
  .fish-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,50,.7);padding:10px 24px;border-radius:30px;font-size:.9rem;color:#a0d0ff;pointer-events:none;backdrop-filter:blur(4px)}

  /* Celebration */
  .celebration{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
  .celebration-emoji{font-size:5rem;animation:bounce .6s ease-in-out infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-20px)}}
  .celebration-title{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#ffd200,#ff6b35,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
  .confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall linear forwards}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

  /* Dashboard */
  .dash-wrap{background:linear-gradient(135deg,#0f0c29,#1a0533);width:100%;height:100%;overflow-y:auto;padding:20px;display:flex;align-items:flex-start;justify-content:center;padding-top:30px}
  .dash-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:32px;max-width:700px;width:100%}
  .dash-title{font-size:1.8rem;font-weight:800;text-align:center;margin-bottom:24px;background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .dash-section{margin-bottom:24px}
  .dash-section-title{font-size:.9rem;text-transform:uppercase;letter-spacing:1px;color:#667eea;margin-bottom:12px;border-bottom:1px solid rgba(102,126,234,.3);padding-bottom:6px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat-card{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;border:1px solid rgba(255,255,255,.08)}
  .stat-val{font-size:2rem;font-weight:900;color:#ffd200}
  .stat-label{font-size:.8rem;color:#a0a0c0;margin-top:4px}
  .level-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .level-row-name{font-size:.85rem;color:#c0c0e0;width:140px;flex-shrink:0}
  .level-row-track{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
  .level-row-fill{height:100%;background:linear-gradient(90deg,#667eea,#f093fb);border-radius:4px}
  .level-row-status{font-size:.75rem;color:#a0a0c0;width:60px;text-align:right;flex-shrink:0}
  .pin-screen{background:rgba(0,0,0,.9);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .pin-title{font-size:1.4rem;font-weight:700;color:#667eea}
  .pin-input{padding:12px 24px;border-radius:12px;border:2px solid #667eea;background:rgba(255,255,255,.1);color:#fff;font-size:1.4rem;text-align:center;letter-spacing:6px;width:180px;outline:none}
  .pin-error{color:#ff6666;font-size:.9rem}
  .info-box{background:rgba(102,126,234,.1);border:1px solid rgba(102,126,234,.3);border-radius:12px;padding:16px;font-size:.85rem;color:#c0c0e0;line-height:1.6}

  /* Star burst */
  .star-burst{position:absolute;pointer-events:none;font-size:2rem;animation:starPop .8s forwards}
  @keyframes starPop{0%{transform:scale(0) translateY(0);opacity:1}50%{transform:scale(1.4) translateY(-30px);opacity:1}100%{transform:scale(0.8) translateY(-60px);opacity:0}}

  /* API key prompt */
  .apikey-screen{background:linear-gradient(135deg,#0f0c29,#302b63);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px}
  .apikey-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:32px;max-width:500px;width:100%;text-align:center}
  .apikey-title{font-size:1.5rem;font-weight:800;color:#f093fb;margin-bottom:12px}
  .apikey-input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:.95rem;outline:none;margin-bottom:16px}
  .apikey-input:focus{border-color:#667eea}
  .apikey-note{font-size:.8rem;color:#808090;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'oral_v2_state';
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}

// ── Level data ────────────────────────────────────────────────────────────────
const LEVELS = [
  { num:1,  name:'First Sounds',   emoji:'🔊', stars:4,  fish:3,  desc:'Any vocalisation — even a sound is celebrated!' },
  { num:2,  name:'First Word',     emoji:'💬', stars:5,  fish:3,  desc:'A single recognisable word like "hi" or "yes".' },
  { num:3,  name:'Two Words',      emoji:'🗣️', stars:5,  fish:3,  desc:'Combine two words like "blue fish" or "I like".' },
  { num:4,  name:'Short Phrase',   emoji:'📢', stars:6,  fish:4,  desc:'3–4 word phrases like "I like fish".' },
  { num:5,  name:'Simple Sentence',emoji:'💡', stars:7,  fish:4,  desc:'5–7 word complete sentences.' },
  { num:6,  name:'Full Sentence',  emoji:'✨', stars:8,  fish:4,  desc:'8–10 word detailed sentences.' },
  { num:7,  name:'Two Sentences',  emoji:'🌟', stars:9,  fish:5,  desc:'Two connected ideas joined with "and then" or "because".' },
  { num:8,  name:'Short Story',    emoji:'📖', stars:10, fish:5,  desc:'3–4 sentence narratives with a beginning and end.' },
  { num:9,  name:'Extended Chat',  emoji:'🎤', stars:11, fish:5,  desc:'Fluent multi-turn back-and-forth conversation.' },
  { num:10, name:'Oral Master',    emoji:'🏆', stars:12, fish:6,  desc:'Full natural conversation on any topic.' },
];

const WIZARD_OPTIONS = [
  'No words yet — just sounds or silence',
  'A few words (1–10 words)',
  'Several words, trying short phrases',
  'Short phrases (3–4 words)',
  'Short sentences (about 5–7 words)',
  'Full sentences (8 or more words)',
  'Short back-and-forth conversations',
  'Longer conversations',
  'Extended conversations — wants to do more',
  'Full conversations — advanced practice',
];

// ── System prompts ────────────────────────────────────────────────────────────
function buildSystemPrompt(levelNum) {
  const base = `You are Oral, a friendly 3D animated character who helps children learn to talk in a fun playground.
You are warm, enthusiastic, patient and gentle. You ALWAYS celebrate every attempt enthusiastically.
NEVER correct pronunciation. NEVER express disappointment. NEVER rush the child.
ALWAYS start your response with enthusiasm like "Wonderful!", "Amazing!", "Great job!", "Fantastic!", "Yes!" etc.

SAFEGUARDING: If the child mentions being hurt, scared, or in danger, respond ONLY with: "Please find a grown-up right now! They will help you! 🤗" then gently change the topic.

PERMITTED TOPICS: greetings, simple feelings, sea animals, ocean, family first names, school activities (general), friends (first names), food, colours, toys, simple activities, imagination, hobbies.
PROHIBITED: violence, strangers, personal info (full name, address, school name, phone), scary content, adult topics.

Keep responses SHORT (2-3 sentences max). Always end with ONE simple question or prompt suited to the child's level.`;

  const levelInstructions = [
    `LEVEL 1 - FIRST SOUNDS: Child may make any sound or no sound. Celebrate ANY vocalisation massively. Ask things like "Can you make any sound for me? Can you say ooh? Ooooh!" Accept any sound as a perfect answer. Use very simple words.`,
    `LEVEL 2 - FIRST WORD: Target single words like "hi", "hello", "bye", "yes", "no". Celebrate single words hugely. Model: if child says nothing, model the word clearly. Ask "Can you say hello to me? 👋"`,
    `LEVEL 3 - TWO WORDS: Target 2-word combinations like "blue fish", "big wave", "I like". Ask simple questions with obvious 2-word answers. E.g. "What colour is your favourite fish?"`,
    `LEVEL 4 - SHORT PHRASE: Target 3-4 word phrases. Ask about favourites. E.g. "What is your favourite food?" Model 3-4 word answers.`,
    `LEVEL 5 - SIMPLE SENTENCE: Target 5-7 word sentences. Ask open questions. E.g. "Tell me about your favourite animal!" Model complete sentences.`,
    `LEVEL 6 - FULL SENTENCE: Target 8-10 word sentences with details. Ask about recent events. E.g. "Tell me about something you did today!"`,
    `LEVEL 7 - TWO SENTENCES: Target 2 connected sentences using "and then", "because", "but". Ask about memorable events. E.g. "Tell me about your best ever day!"`,
    `LEVEL 8 - SHORT STORY: Target 3-4 sentence narratives with beginning, middle, end. E.g. "Tell me a story about a friendly fish!"`,
    `LEVEL 9 - EXTENDED CHAT: Encourage fluent multi-turn conversation with expanding detail. Ask open questions. E.g. "What do you love most in the whole world?"`,
    `LEVEL 10 - ORAL MASTER: Open confident conversation on any topic. Celebrate their amazing ability. E.g. "You are incredible! What shall we talk about today?"`,
  ];

  return base + '\n\n' + levelInstructions[levelNum - 1];
}

// ── Three.js helpers ──────────────────────────────────────────────────────────
function buildOralCharacter(THREE) {
  const group = new THREE.Group();
  const skin = new THREE.MeshPhongMaterial({ color: 0xFFCBA4 });
  const skinMat = skin;
  const blueMat = new THREE.MeshPhongMaterial({ color: 0x3355AA });
  const darkBlueMat = new THREE.MeshPhongMaterial({ color: 0x223377 });
  const blackMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
  const whiteMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
  const brownMat = new THREE.MeshPhongMaterial({ color: 0x5C3317 });
  const redMat = new THREE.MeshPhongMaterial({ color: 0xCC2222 });
  const pinkMat = new THREE.MeshPhongMaterial({ color: 0xFF9999 });
  const darkRedMat = new THREE.MeshPhongMaterial({ color: 0x8B0000 });
  const torusMat = new THREE.MeshPhongMaterial({ color: 0xCC2222 });

  // Head group
  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.65, 0);
  group.add(headGroup);

  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), skinMat);
  headGroup.add(headMesh);

  // Hair
  const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.29, 16, 8, 0, Math.PI*2, 0, Math.PI*0.5), brownMat);
  hairMesh.position.y = 0.05;
  headGroup.add(hairMesh);

  // Eyes
  function makeEye(xOff) {
    const eyeG = new THREE.Group();
    eyeG.position.set(xOff, 0.06, 0.24);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), whiteMat);
    eyeG.add(white);
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), new THREE.MeshPhongMaterial({color:0x5C3317}));
    iris.position.z = 0.03;
    eyeG.add(iris);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), blackMat);
    pupil.position.z = 0.055;
    eyeG.add(pupil);
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.01, 6, 6), new THREE.MeshPhongMaterial({color:0xFFFFFF,emissive:0xFFFFFF}));
    shine.position.set(0.015, 0.015, 0.07);
    eyeG.add(shine);
    return eyeG;
  }
  headGroup.add(makeEye(-0.1));
  headGroup.add(makeEye(0.1));

  // Eyebrows
  function makeEyebrow(xOff) {
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.016, 0.012), brownMat);
    brow.position.set(xOff, 0.16, 0.25);
    brow.rotation.z = xOff < 0 ? 0.15 : -0.15;
    return brow;
  }
  headGroup.add(makeEyebrow(-0.1));
  headGroup.add(makeEyebrow(0.1));

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), skinMat);
  nose.position.set(0, -0.02, 0.28);
  headGroup.add(nose);

  // Cheeks
  const cheekMat = new THREE.MeshPhongMaterial({color:0xFFAABB,transparent:true,opacity:0.4});
  [-0.17, 0.17].forEach(x => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), cheekMat);
    cheek.position.set(x, -0.04, 0.22);
    headGroup.add(cheek);
  });

  // Mouth group
  const mouthGroup = new THREE.Group();
  mouthGroup.position.set(0, -0.1, 0.27);
  headGroup.add(mouthGroup);

  // Closed smile (torus)
  const smileMesh = new THREE.Mesh(
    new THREE.TorusGeometry(0.055, 0.012, 8, 16, Math.PI),
    torusMat
  );
  smileMesh.rotation.z = Math.PI;
  mouthGroup.add(smileMesh);

  // Open mouth group
  const openMouthGroup = new THREE.Group();
  openMouthGroup.visible = false;
  mouthGroup.add(openMouthGroup);

  const cavity = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.04, 0.04, 12), darkRedMat);
  cavity.rotation.x = Math.PI/2;
  openMouthGroup.add(cavity);

  const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.016, 0.012), whiteMat);
  teeth.position.set(0, 0.025, 0.008);
  openMouthGroup.add(teeth);

  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), pinkMat);
  tongue.position.set(0, -0.015, -0.01);
  openMouthGroup.add(tongue);

  const upperLip = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.016, 0.012), redMat);
  upperLip.position.set(0, 0.038, 0.015);
  openMouthGroup.add(upperLip);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.14, 10), skinMat);
  neck.position.set(0, 1.48, 0);
  group.add(neck);

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.52, 0.26), blueMat);
  torso.position.set(0, 1.13, 0);
  group.add(torso);

  // Collar
  const collarMat = new THREE.MeshPhongMaterial({color:0xFFFFFF,transparent:true,opacity:0.6});
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.15), collarMat);
  collar.position.set(0, 1.36, 0.1);
  group.add(collar);

  // Waist
  const waist = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.18, 0.24), darkBlueMat);
  waist.position.set(0, 0.84, 0);
  group.add(waist);

  // Arms
  function makeArm(side) {
    const armGroup = new THREE.Group();
    armGroup.position.set(side * 0.28, 1.3, 0);
    const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.28, 10), skinMat);
    upperArm.position.set(side * 0.055, -0.14, 0);
    armGroup.add(upperArm);
    const elbowGroup = new THREE.Group();
    elbowGroup.position.set(side * 0.055, -0.28, 0);
    const lowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.26, 10), skinMat);
    lowerArm.position.set(0, -0.13, 0);
    elbowGroup.add(lowerArm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), skinMat);
    hand.position.set(0, -0.26, 0);
    elbowGroup.add(hand);
    armGroup.add(elbowGroup);
    return { armGroup, elbowGroup };
  }
  const leftArm = makeArm(-1);
  const rightArm = makeArm(1);
  group.add(leftArm.armGroup);
  group.add(rightArm.armGroup);

  // Legs
  function makeLeg(side) {
    const legGroup = new THREE.Group();
    legGroup.position.set(side * 0.13, 0.75, 0);
    const upperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.38, 10), darkBlueMat);
    upperLeg.position.set(0, -0.19, 0);
    legGroup.add(upperLeg);
    const kneeGroup = new THREE.Group();
    kneeGroup.position.set(0, -0.38, 0);
    const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 0.36, 10), darkBlueMat);
    lowerLeg.position.set(0, -0.18, 0);
    kneeGroup.add(lowerLeg);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.2), blackMat);
    foot.position.set(0, -0.38, 0.04);
    kneeGroup.add(foot);
    legGroup.add(kneeGroup);
    return { legGroup, kneeGroup };
  }
  const leftLeg = makeLeg(-1);
  const rightLeg = makeLeg(1);
  group.add(leftLeg.legGroup);
  group.add(rightLeg.legGroup);

  return {
    root: group,
    headGroup,
    leftArm, rightArm,
    leftLeg, rightLeg,
    smileMesh, openMouthGroup,
  };
}

function buildPlayground(THREE, scene) {
  const cloudsList = [];
  let mgrDisk = null;

  // Ground
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  scene.add(ground);

  // Colour patches
  const patchColors = [0x43A047, 0x66BB6A, 0x388E3C];
  for (let i = 0; i < 12; i++) {
    const patch = new THREE.Mesh(
      new THREE.CircleGeometry(0.8 + Math.random() * 1.5, 12),
      new THREE.MeshLambertMaterial({ color: patchColors[i % 3] })
    );
    patch.rotation.x = -Math.PI / 2;
    patch.position.set((Math.random() - 0.5) * 20, 0.01, (Math.random() - 0.5) * 20);
    scene.add(patch);
  }

  // Fence
  const fencePostMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
  const fenceRailMat = new THREE.MeshPhongMaterial({ color: 0xEEEEEE });
  function addFenceSection(x, z, rotY, length) {
    const railGeo = new THREE.BoxGeometry(length, 0.05, 0.04);
    const r1 = new THREE.Mesh(railGeo, fenceRailMat);
    r1.position.set(x, 0.55, z);
    r1.rotation.y = rotY;
    scene.add(r1);
    const r2 = new THREE.Mesh(railGeo, fenceRailMat);
    r2.position.set(x, 0.85, z);
    r2.rotation.y = rotY;
    scene.add(r2);
    const numPosts = Math.ceil(length / 1.5) + 1;
    for (let i = 0; i <= numPosts; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.1, 0.06), fencePostMat);
      const offset = (i / numPosts - 0.5) * length;
      const dx = Math.cos(rotY) * offset;
      const dz = Math.sin(rotY) * offset;
      post.position.set(x + dx, 0.55, z + dz);
      scene.add(post);
    }
  }
  addFenceSection(0, -16, 0, 32);
  addFenceSection(0, 16, 0, 32);
  addFenceSection(-16, 0, Math.PI/2, 32);
  addFenceSection(16, 0, Math.PI/2, 32);

  // Trees
  const trunkMat = new THREE.MeshPhongMaterial({ color: 0x8B5E3C });
  const canopyColors = [0x2E7D32, 0x388E3C, 0x43A047, 0x1B5E20];
  const treePositions = [[-8,-8],[-10,5],[7,-9],[9,4],[-5,-13],[6,-13],[-12,-3],[11,-3]];
  treePositions.forEach(([tx, tz], i) => {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 1.2, 8), trunkMat);
    trunk.position.set(tx, 0.6, tz);
    scene.add(trunk);
    for (let l = 0; l < 3; l++) {
      const layer = new THREE.Mesh(
        new THREE.SphereGeometry(0.9 - l * 0.18, 10, 8),
        new THREE.MeshPhongMaterial({ color: canopyColors[(i + l) % 4] })
      );
      layer.position.set(tx, 1.6 + l * 0.45, tz);
      scene.add(layer);
    }
  });

  // Flowers
  const flowerColors = [0xFF5252, 0xFF4081, 0xFFD740, 0x69F0AE, 0x40C4FF, 0xEA80FC];
  for (let i = 0; i < 40; i++) {
    const fx = (Math.random() - 0.5) * 28;
    const fz = (Math.random() - 0.5) * 28;
    const stemMat = new THREE.MeshPhongMaterial({ color: 0x4CAF50 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.25, 6), stemMat);
    stem.position.set(fx, 0.125, fz);
    scene.add(stem);
    const flower = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 8, 8),
      new THREE.MeshPhongMaterial({ color: flowerColors[i % 6] })
    );
    flower.position.set(fx, 0.27, fz);
    scene.add(flower);
  }

  // Slide
  const slideMat = new THREE.MeshPhongMaterial({ color: 0xFF5252 });
  const slideYellowMat = new THREE.MeshPhongMaterial({ color: 0xFDD835 });
  const slideFrame = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.0, 0.1), slideMat);
  slideFrame.position.set(-12, 1.0, -4);
  scene.add(slideFrame);
  const slideFrame2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.0, 0.1), slideMat);
  slideFrame2.position.set(-12, 1.0, -3);
  scene.add(slideFrame2);
  const slideSurface = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.06, 2.0), slideYellowMat);
  slideSurface.position.set(-12, 1.1, -3.5);
  slideSurface.rotation.x = -0.5;
  scene.add(slideSurface);

  // Swing set
  const swingMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
  const swingSeatMat = new THREE.MeshPhongMaterial({ color: 0xFF80AB });
  const swingTop = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.1, 0.1), swingMat);
  swingTop.position.set(-12, 2.3, 3);
  scene.add(swingTop);
  const swingL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8), swingMat);
  swingL.position.set(-13.4, 1.1, 3);
  swingL.rotation.z = 0.2;
  scene.add(swingL);
  const swingR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8), swingMat);
  swingR.position.set(-10.6, 1.1, 3);
  swingR.rotation.z = -0.2;
  scene.add(swingR);
  [-12.6, -11].forEach(sx => {
    const chain = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.2, 0.04), swingMat);
    chain.position.set(sx, 1.9, 3);
    scene.add(chain);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 0.3), swingSeatMat);
    seat.position.set(sx, 1.3, 3);
    scene.add(seat);
  });

  // Merry-go-round
  const mgrBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8), new THREE.MeshPhongMaterial({color:0x888888}));
  mgrBase.position.set(12, 0.3, -5);
  scene.add(mgrBase);
  mgrDisk = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.12, 18), new THREE.MeshPhongMaterial({color:0xFF6F00}));
  mgrDisk.position.set(12, 0.65, -5);
  scene.add(mgrDisk);
  for (let s = 0; s < 6; s++) {
    const angle = (s / 6) * Math.PI * 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.07, 0.07), new THREE.MeshPhongMaterial({color:0xE65100}));
    spoke.position.set(12, 0.72, -5);
    spoke.rotation.y = angle;
    scene.add(spoke);
  }

  // Sandbox
  const sandboxMat = new THREE.MeshPhongMaterial({ color: 0x8B6914 });
  const sandMat = new THREE.MeshLambertMaterial({ color: 0xF5DEB3 });
  const sbFrame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 2.2), sandboxMat);
  sbFrame.position.set(12, 0.1, 4);
  scene.add(sbFrame);
  const sandFill = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.15, 1.9), sandMat);
  sandFill.position.set(12, 0.17, 4);
  scene.add(sandFill);

  // Clouds
  const cloudMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
  const cloudPositions = [[-8,8,-10],[5,9,-12],[12,7.5,-8],[-3,8.5,-14],[0,9,-6],[8,8,-4],[-14,7,-7],[14,9,-11]];
  cloudPositions.forEach(([cx, cy, cz]) => {
    const cloudG = new THREE.Group();
    cloudG.position.set(cx, cy, cz);
    for (let c = 0; c < 5; c++) {
      const blob = new THREE.Mesh(new THREE.SphereGeometry(0.55 + Math.random() * 0.35, 8, 8), cloudMat);
      blob.position.set((c - 2) * 0.55, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.3);
      cloudG.add(blob);
    }
    scene.add(cloudG);
    cloudsList.push(cloudG);
  });

  return { clouds: cloudsList, mgrDisk };
}

// ── Setup Talk Scene ──────────────────────────────────────────────────────────
function setupTalkScene(canvas, stateRef) {
  const THREE = window.THREE;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.setClearColor(0x87CEEB);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x87CEEB, 18, 35);

  const camera = new THREE.PerspectiveCamera(52, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
  camera.position.set(0, 2.4, 7.2);
  camera.lookAt(0, 1.1, 0);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.65);
  scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xFFE8C8, 0.9);
  sunLight.position.set(6, 12, 8);
  scene.add(sunLight);
  const fillLight = new THREE.DirectionalLight(0xC8DDFF, 0.4);
  fillLight.position.set(-5, 4, -3);
  scene.add(fillLight);

  const character = buildOralCharacter(THREE);
  scene.add(character.root);
  character.root.position.set(3, 0, 1);
  character.root.rotation.y = -0.5;

  const { clouds, mgrDisk } = buildPlayground(THREE, scene);

  // Speech bubble sprite
  const bubbleCanvas = document.createElement('canvas');
  bubbleCanvas.width = 512; bubbleCanvas.height = 220;
  const bubbleTex = new THREE.CanvasTexture(bubbleCanvas);
  const bubbleSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: bubbleTex, transparent: true }));
  bubbleSprite.scale.set(3.0, 1.3, 1);
  bubbleSprite.position.set(0, 2.5, 0);
  bubbleSprite.visible = false;
  character.root.add(bubbleSprite);

  function drawBubble(text) {
    const ctx = bubbleCanvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 220);
    ctx.fillStyle = '#FFFFFF';
    const r = 30;
    ctx.beginPath();
    ctx.moveTo(r, 10); ctx.lineTo(512-r, 10);
    ctx.arcTo(512-10, 10, 512-10, 220-r, r);
    ctx.lineTo(512-10, 220-r);
    ctx.arcTo(512-10, 210, 512-10-r, 210, r);
    ctx.lineTo(280, 210); ctx.lineTo(256, 220); ctx.lineTo(230, 210);
    ctx.lineTo(r, 210);
    ctx.arcTo(10, 210, 10, 210-r, r);
    ctx.lineTo(10, r);
    ctx.arcTo(10, 10, r, 10, r);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3355AA';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#1a1a2e';
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > 460) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    const lineH = 36;
    const startY = 110 - ((lines.length - 1) * lineH) / 2;
    lines.forEach((l, i) => ctx.fillText(l, 256, startY + i * lineH));
    bubbleTex.needsUpdate = true;
  }

  // Walk path
  let walkAngle = 0;
  let approachActive = false;
  let walkActive = true;
  let mouthInterval = null;
  let lastTime = performance.now();

  function setMouthOpen(open) {
    character.smileMesh.visible = !open;
    character.openMouthGroup.visible = open;
  }

  function startTalking(text) {
    approachActive = true;
    walkActive = false;
    if (text) {
      drawBubble(text);
      bubbleSprite.visible = true;
    }
    if (mouthInterval) clearInterval(mouthInterval);
    let mouthOpen = false;
    mouthInterval = setInterval(() => {
      mouthOpen = !mouthOpen;
      setMouthOpen(mouthOpen);
    }, 140);
  }

  function stopTalking() {
    if (mouthInterval) { clearInterval(mouthInterval); mouthInterval = null; }
    setMouthOpen(false);
    bubbleSprite.visible = false;
    setTimeout(() => { walkActive = true; approachActive = false; }, 2000);
  }

  let rafId;
  function animate() {
    rafId = requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const t = now * 0.001;

    const state = stateRef.current;

    if (state.speaking) {
      startTalking._armed = true;
      if (!mouthInterval) {
        let mO = false;
        mouthInterval = setInterval(() => { mO = !mO; setMouthOpen(mO); }, 140);
      }
      if (state.lastText && state.lastText !== startTalking._lastDrawn) {
        startTalking._lastDrawn = state.lastText;
        drawBubble(state.lastText);
        bubbleSprite.visible = true;
      }
      approachActive = true;
      walkActive = false;
    } else {
      if (startTalking._armed) {
        startTalking._armed = false;
        if (mouthInterval) { clearInterval(mouthInterval); mouthInterval = null; }
        setMouthOpen(false);
        bubbleSprite.visible = false;
        setTimeout(() => { walkActive = true; approachActive = false; }, 3000);
      }
    }

    if (state.listening) {
      character.headGroup.rotation.x = Math.lerp ? Math.lerp(character.headGroup.rotation.x, -0.1, 0.05) : character.headGroup.rotation.x * 0.95 + (-0.1) * 0.05;
    } else {
      character.headGroup.rotation.x = character.headGroup.rotation.x * 0.95;
    }

    if (state.celebrating) {
      const bounce = Math.abs(Math.sin(t * 6));
      character.root.position.y = bounce * 0.3;
      character.leftArm.armGroup.rotation.z = -2.0;
      character.rightArm.armGroup.rotation.z = 2.0;
    } else {
      character.root.position.y = 0;
      if (walkActive) {
        walkAngle += dt * 0.4;
        const radius = 3.5;
        const tx = Math.cos(walkAngle) * radius;
        const tz = Math.sin(walkAngle) * radius;
        const dx = tx - character.root.position.x;
        const dz = tz - character.root.position.z;
        character.root.position.x += dx * dt * 1.5;
        character.root.position.z += dz * dt * 1.5;
        const targetAngle = Math.atan2(dx, dz);
        const dRot = targetAngle - character.root.rotation.y;
        character.root.rotation.y += Math.max(-0.08, Math.min(0.08, dRot));

        const walk = Math.sin(t * 3);
        character.leftLeg.legGroup.rotation.x = walk * 0.55;
        character.rightLeg.legGroup.rotation.x = -walk * 0.55;
        character.leftArm.armGroup.rotation.x = -walk * 0.4;
        character.rightArm.armGroup.rotation.x = walk * 0.4;
        character.leftLeg.kneeGroup.rotation.x = Math.max(0, Math.sin(t * 3) * 0.3);
        character.rightLeg.kneeGroup.rotation.x = Math.max(0, -Math.sin(t * 3) * 0.3);
        character.leftArm.armGroup.rotation.z = 0.1;
        character.rightArm.armGroup.rotation.z = -0.1;

        // Idle wave
        if (Math.sin(t * 0.3) > 0.9) {
          character.rightArm.armGroup.rotation.x = -1.5;
          character.rightArm.armGroup.rotation.z = 0.4;
        }
      } else if (approachActive) {
        const dy = character.root.rotation.y;
        character.root.rotation.y += (0 - dy) * 0.06;
        const pdx = 0 - character.root.position.x;
        const pdz = 1.5 - character.root.position.z;
        character.root.position.x += pdx * dt * 1.8;
        character.root.position.z += pdz * dt * 1.8;
        // Talking gestures
        character.leftArm.armGroup.rotation.x = Math.sin(t * 2) * 0.4 - 0.3;
        character.rightArm.armGroup.rotation.x = Math.sin(t * 2 + 1) * 0.4 - 0.3;
        character.leftArm.armGroup.rotation.z = 0.3;
        character.rightArm.armGroup.rotation.z = -0.3;
        character.leftLeg.legGroup.rotation.x = 0;
        character.rightLeg.legGroup.rotation.x = 0;
      }

      // Body idle sway when standing still
      if (!walkActive && !approachActive) {
        character.root.rotation.z = Math.sin(t * 0.8) * 0.02;
      }
    }

    // Clouds drift
    clouds.forEach(c => {
      c.position.x += dt * 0.5;
      if (c.position.x > 20) c.position.x = -20;
    });

    // MGR spin
    if (mgrDisk) mgrDisk.rotation.y += dt * 0.5;

    renderer.render(scene, camera);
  }

  animate();

  const resize = () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  };
  window.addEventListener('resize', resize);

  return () => {
    cancelAnimationFrame(rafId);
    window.removeEventListener('resize', resize);
    if (mouthInterval) clearInterval(mouthInterval);
    renderer.dispose();
    renderer.forceContextLoss();
  };
}

// ── Setup Fish Scene ──────────────────────────────────────────────────────────
function setupFishScene(canvas, { fishCount, onComplete }) {
  const THREE = window.THREE;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);

  camera.position.set(0, 3.5, 9);
  camera.lookAt(0, 1.2, 0);

  const ambient = new THREE.AmbientLight(0x204060, 1.0);
  scene.add(ambient);
  const spot1 = new THREE.SpotLight(0xB0DFFF, 1.2);
  spot1.position.set(-3, 6, 2);
  spot1.target.position.set(-3, 1, 0);
  scene.add(spot1); scene.add(spot1.target);
  const spot2 = new THREE.SpotLight(0xB0DFFF, 1.2);
  spot2.position.set(3, 6, 2);
  spot2.target.position.set(3, 1, 0);
  scene.add(spot2); scene.add(spot2.target);
  const fill = new THREE.PointLight(0x4080C0, 0.5);
  fill.position.set(0, 3, 5);
  scene.add(fill);

  // Table
  const tableMat = new THREE.MeshPhongMaterial({ color: 0x5C3317 });
  const tableTop = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.18, 3.0), tableMat);
  tableTop.position.set(0, 0.3, 0);
  scene.add(tableTop);
  [[-4.2,-1],[-4.2,1],[4.2,-1],[4.2,1]].forEach(([tx,tz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 8), tableMat);
    leg.position.set(tx, 0.1, tz);
    scene.add(leg);
  });

  function buildTank(centerX) {
    const tankG = new THREE.Group();
    tankG.position.set(centerX, 0.4, 0);

    const glassMat = new THREE.MeshPhongMaterial({color:0x88BBFF,transparent:true,opacity:0.22,side:THREE.DoubleSide});
    const frameMat = new THREE.MeshPhongMaterial({color:0x4488FF,emissive:0x112244});
    const sandMat = new THREE.MeshLambertMaterial({color:0xD2B48C});
    const waterMat = new THREE.MeshPhongMaterial({color:0x1565C0,transparent:true,opacity:0.28});
    const seaweedMat = new THREE.MeshLambertMaterial({color:0x2E7D32});

    const W = 2.8, H = 2.0, D = 1.8;

    // Glass walls
    const planes = [
      {w:W,h:H,pos:[0,H/2,D/2],rot:[0,0,0]},
      {w:W,h:H,pos:[0,H/2,-D/2],rot:[0,0,0]},
      {w:D,h:H,pos:[-W/2,H/2,0],rot:[0,Math.PI/2,0]},
      {w:D,h:H,pos:[W/2,H/2,0],rot:[0,Math.PI/2,0]},
    ];
    planes.forEach(p => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(p.w,p.h), glassMat);
      m.position.set(...p.pos);
      m.rotation.set(...p.rot);
      tankG.add(m);
    });

    // Frame edges
    const edgeGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
    const corners = [[-W/2,0,-D/2],[-W/2,0,D/2],[W/2,0,-D/2],[W/2,0,D/2],
                     [-W/2,H,-D/2],[-W/2,H,D/2],[W/2,H,-D/2],[W/2,H,D/2]];
    corners.forEach(c => {
      const e = new THREE.Mesh(edgeGeo, frameMat);
      e.position.set(...c);
      tankG.add(e);
    });
    // Top and bottom rails
    const topBot = new THREE.BoxGeometry(W, 0.05, 0.05);
    [[0,0,-D/2],[0,0,D/2],[0,H,-D/2],[0,H,D/2]].forEach(pos => {
      const r = new THREE.Mesh(topBot, frameMat);
      r.position.set(...pos);
      tankG.add(r);
    });
    const sides = new THREE.BoxGeometry(0.05, H, 0.05);
    [[-W/2,H/2,-D/2],[-W/2,H/2,D/2],[W/2,H/2,-D/2],[W/2,H/2,D/2]].forEach(pos => {
      const r = new THREE.Mesh(sides, frameMat);
      r.position.set(...pos);
      tankG.add(r);
    });

    // Sand
    const sand = new THREE.Mesh(new THREE.BoxGeometry(W-0.1, 0.12, D-0.1), sandMat);
    sand.position.set(0, 0.06, 0);
    tankG.add(sand);

    // Water
    const water = new THREE.Mesh(new THREE.BoxGeometry(W-0.08, H-0.2, D-0.08), waterMat);
    water.position.set(0, (H-0.2)/2 + 0.1, 0);
    tankG.add(water);

    // Seaweed
    for (let s = 0; s < 4; s++) {
      const sh = 0.5 + Math.random() * 0.9;
      const sw = new THREE.Mesh(new THREE.BoxGeometry(0.06, sh, 0.06), seaweedMat);
      sw.position.set((Math.random()-0.5)*(W-0.5), sh/2 + 0.12, (Math.random()-0.5)*(D-0.4));
      tankG.add(sw);
    }

    scene.add(tankG);
    return tankG;
  }

  const leftTank = buildTank(-3.0);
  const rightTank = buildTank(3.0);

  function buildFish(color) {
    const fishG = new THREE.Group();
    const mat = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.05 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), mat);
    body.scale.set(1.75, 1, 1);
    fishG.add(body);

    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.22, 4), mat);
    tail.position.set(-0.35, 0, 0);
    tail.rotation.z = Math.PI / 2;
    fishG.add(tail);

    const tailFin = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.16, 4), mat);
    tailFin.position.set(-0.38, 0.08, 0);
    tailFin.rotation.z = Math.PI / 2 + 0.4;
    fishG.add(tailFin);

    const dorsalFin = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.15, 4), mat);
    dorsalFin.position.set(0, 0.18, 0);
    fishG.add(dorsalFin);

    const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), new THREE.MeshPhongMaterial({color:0xFFFFFF}));
    eyeWhite.position.set(0.26, 0.05, 0.1);
    fishG.add(eyeWhite);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), new THREE.MeshPhongMaterial({color:0x111111}));
    pupil.position.set(0.29, 0.05, 0.12);
    fishG.add(pupil);

    const pectoral = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 4), new THREE.MeshPhongMaterial({color,transparent:true,opacity:0.7}));
    pectoral.position.set(0.1, -0.1, 0.15);
    pectoral.rotation.z = -0.5;
    fishG.add(pectoral);

    fishG._mat = mat;
    return fishG;
  }

  const FISH_COLORS = [0xFF6B35, 0x00BCD4, 0xFFD740, 0xFF80AB, 0x40C4FF, 0x69F0AE];
  const fishList = [];
  const fishPhases = [];
  const fishInRight = [];
  const fishFlying = [];

  for (let i = 0; i < fishCount; i++) {
    const fish = buildFish(FISH_COLORS[i % FISH_COLORS.length]);
    fish.position.set(-3 + (Math.random()-0.5)*2.2, 0.7 + Math.random()*1.2, (Math.random()-0.5)*1.2);
    scene.add(fish);
    fishList.push(fish);
    fishPhases.push(Math.random() * Math.PI * 2);
    fishInRight.push(false);
    fishFlying.push(false);
  }

  // Bubbles
  const bubbles = [];
  const bubbleMat = new THREE.MeshPhongMaterial({color:0xAADDFF,transparent:true,opacity:0.4});
  for (let i = 0; i < 24; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.03 + Math.random()*0.04, 6, 6), bubbleMat);
    const inRight = i >= 12;
    const bx = inRight ? 3 : -3;
    b.position.set(bx + (Math.random()-0.5)*2.4, Math.random()*1.8+0.2, (Math.random()-0.5)*1.4);
    b._rise = 0.4 + Math.random() * 0.6;
    b._drift = (Math.random()-0.5)*0.15;
    b._tank = inRight ? 3 : -3;
    b._maxY = 2.1;
    scene.add(b);
    bubbles.push(b);
  }

  let movedCount = 0;
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function flyFish(idx) {
    if (fishFlying[idx] || fishInRight[idx]) return;
    fishFlying[idx] = true;
    const fish = fishList[idx];
    fish._mat.emissiveIntensity = 0.35;

    const startX = fish.position.x;
    const startY = fish.position.y;
    const startZ = fish.position.z;
    const endX = 3 + (Math.random()-0.5)*1.8;
    const endY = 0.7 + Math.random()*0.9;
    const endZ = (Math.random()-0.5)*1.2;
    const dur = 1.35;
    let elapsed = 0;
    const fly = setInterval(() => {
      elapsed += 1/60;
      const t = Math.min(elapsed / dur, 1);
      fish.position.x = startX + (endX - startX) * t;
      fish.position.y = startY + Math.sin(t * Math.PI) * 4.5 + (endY - startY) * t;
      fish.position.z = startZ + (endZ - startZ) * t;
      fish.rotation.z = Math.sin(t * Math.PI) * 0.4;
      fish.rotation.y = endX > startX ? 0 : Math.PI;
      if (t >= 1) {
        clearInterval(fly);
        fishFlying[idx] = false;
        fishInRight[idx] = true;
        fish._mat.emissiveIntensity = 0.08;
        fish.rotation.z = 0;
        movedCount++;
        if (onComplete) onComplete(movedCount);
      }
    }, 1000/60);
  }

  function onClick(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(fishList, true);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !fishList.includes(obj)) obj = obj.parent;
      const idx = fishList.indexOf(obj);
      if (idx >= 0 && !fishInRight[idx]) flyFish(idx);
    }
  }

  function onMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(fishList, true);
    const hitFish = new Set();
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !fishList.includes(obj)) obj = obj.parent;
      const idx = fishList.indexOf(obj);
      if (idx >= 0 && !fishInRight[idx]) { hitFish.add(idx); canvas.style.cursor = 'pointer'; }
      else canvas.style.cursor = 'default';
    } else canvas.style.cursor = 'default';
    fishList.forEach((f, i) => {
      const target = hitFish.has(i) ? 0.25 : (fishInRight[i] ? 0.08 : 0.05);
      f._mat.emissiveIntensity += (target - f._mat.emissiveIntensity) * 0.12;
    });
  }

  canvas.addEventListener('click', onClick);
  canvas.addEventListener('touchstart', onClick);
  canvas.addEventListener('mousemove', onMouseMove);

  let rafId;
  let lastTime = performance.now();

  function animate() {
    rafId = requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const t = now * 0.001;

    fishList.forEach((fish, i) => {
      if (!fishFlying[i]) {
        if (!fishInRight[i]) {
          const phase = fishPhases[i];
          fish.position.x = -3 + Math.sin(t * 0.55 + phase) * 1.05;
          fish.position.y = 0.7 + Math.sin(t * 0.75 + phase * 1.3) * 0.62;
          fish.position.z = Math.cos(t * 0.45 + phase * 0.8) * 0.5;
          fish.rotation.y = Math.sin(t * 0.55 + phase) > 0 ? 0 : Math.PI;
        } else {
          const phase = fishPhases[i] + 3;
          fish.position.x = 3 + Math.sin(t * 0.5 + phase) * 0.9;
          fish.position.y = 0.7 + Math.sin(t * 0.7 + phase * 1.2) * 0.5;
          fish.position.z = Math.cos(t * 0.4 + phase * 0.9) * 0.5;
          fish.rotation.y = Math.sin(t * 0.5 + phase) > 0 ? 0 : Math.PI;
        }
        fish.children[1].rotation.y = Math.sin(t * 8 + fishPhases[i]) * 0.28;
      }
    });

    bubbles.forEach(b => {
      b.position.y += b._rise * dt;
      b.position.x += b._drift * dt;
      if (b.position.y > b._maxY) {
        b.position.y = 0.15;
        b.position.x = b._tank + (Math.random()-0.5)*2.2;
      }
    });

    renderer.render(scene, camera);
  }
  animate();

  const resize = () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  };
  window.addEventListener('resize', resize);

  return () => {
    cancelAnimationFrame(rafId);
    canvas.removeEventListener('click', onClick);
    canvas.removeEventListener('touchstart', onClick);
    canvas.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('resize', resize);
    renderer.dispose();
    renderer.forceContextLoss();
  };
}

function Confetti() {
  const pieces = Array.from({length:60}, (_,i) => ({
    id:i,
    x: Math.random()*100,
    color: ['#ffd200','#ff6b35','#f093fb','#667eea','#38ef7d','#ff4081'][i%6],
    delay: Math.random()*2,
    duration: 2 + Math.random()*2,
    rotate: Math.random()*360,
  }));
  return (
    <div className="confetti-wrap">
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{
          left:`${p.x}%`,
          background: p.color,
          animationDelay:`${p.delay}s`,
          animationDuration:`${p.duration}s`,
          transform:`rotate(${p.rotate}deg)`,
        }}/>
      ))}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function OralApp() {
  const saved = loadState();

  const [view, setView] = useState(saved ? 'talk' : 'welcome'); // welcome | wizard | talk | fishgame | dashboard | celebration
  const [apiKey, setApiKey] = useState(saved?.apiKey || '');
  const [apiKeyInput, setApiKeyInput] = useState('');
  const [showApiKeyScreen, setShowApiKeyScreen] = useState(!saved?.apiKey);
  const [level, setLevel] = useState(saved?.level || 1);
  const [stars, setStars] = useState(saved?.stars || 0);
  const [totalStars, setTotalStars] = useState(saved?.totalStars || 0);
  const [levelProgress, setLevelProgress] = useState(saved?.levelProgress || Array(10).fill(0));
  const [sessionTurns, setSessionTurns] = useState(0);
  const [sessionWords, setSessionWords] = useState(0);
  const [messages, setMessages] = useState([]);
  const [speaking, setSpeaking] = useState(false);
  const [listening, setListening] = useState(false);
  const [lastText, setLastText] = useState('');
  const [celebrating, setCelebrating] = useState(false);
  const [typingMode, setTypingMode] = useState(false);
  const [textInput, setTextInput] = useState('');
  const [wizardChoice, setWizardChoice] = useState(null);
  const [wizardLevel, setWizardLevel] = useState(1);
  const [fishMoved, setFishMoved] = useState(0);
  const [showCelebration, setShowCelebration] = useState(false);
  const [celebrationMsg, setCelebrationMsg] = useState('');
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState('');
  const [dashUnlocked, setDashUnlocked] = useState(false);
  const [starBursts, setStarBursts] = useState([]);

  const canvasRef = useRef(null);
  const sceneState = useRef({ speaking: false, listening: false, lastText: '', celebrating: false });
  const recognitionRef = useRef(null);
  const ttsRef = useRef(null);

  // Sync refs
  useEffect(() => { sceneState.current.speaking = speaking; }, [speaking]);
  useEffect(() => { sceneState.current.listening = listening; }, [listening]);
  useEffect(() => { sceneState.current.lastText = lastText; }, [lastText]);
  useEffect(() => { sceneState.current.celebrating = celebrating; }, [celebrating]);

  // Persist
  useEffect(() => {
    if (apiKey) saveState({ apiKey, level, stars, totalStars, levelProgress });
  }, [apiKey, level, stars, totalStars, levelProgress]);

  const levelData = LEVELS[level - 1];

  // ── Talk scene setup ──
  useEffect(() => {
    if (view !== 'talk' || !canvasRef.current) return;
    const cleanup = setupTalkScene(canvasRef.current, sceneState);
    return cleanup;
  }, [view]);

  // Fish scene setup
  useEffect(() => {
    if (view !== 'fishgame' || !canvasRef.current) return;
    const fishCount = levelData.fish;
    setFishMoved(0);
    let done = false;
    const cleanup = setupFishScene(canvasRef.current, {
      fishCount,
      onComplete: (moved) => {
        setFishMoved(moved);
        if (moved >= fishCount && !done) {
          done = true;
          setTimeout(() => levelUp(), 1000);
        }
      }
    });
    return cleanup;
  }, [view]);

  // ── Greeting on enter talk ──
  useEffect(() => {
    if (view === 'talk' && messages.length === 0 && apiKey) {
      const timeout = setTimeout(() => oralSpeak(getGreeting(level)), 1200);
      return () => clearTimeout(timeout);
    }
  }, [view, apiKey]);

  function getGreeting(lvl) {
    const greetings = [
      "Hellooo! I'm Oral! Can you make any sound for me? Even just say ooh! 🎉",
      "Hi there! I'm so happy to see you! Can you say hello to me? 👋",
      "Hello hello! I'm Oral! What's your favourite colour? Tell me two words! 🌈",
      "Yay, you're here! I'm Oral! What is your favourite food? Tell me! 🍎",
      "Amazing, you came to play! I'm Oral! Tell me about your favourite animal! 🐬",
      "Wonderful! I'm Oral! Tell me something you did today — a whole sentence! ✨",
      "Incredible! I'm Oral! Tell me about your best ever day! 🌟",
      "Wow, fantastic! I'm Oral! Tell me a short story about a fish! 📖",
      "Oh wow, you're amazing! I'm Oral! What do you love most in the whole world? 🎤",
      "You are INCREDIBLE! I'm Oral — and so are you! What shall we talk about today? 🏆",
    ];
    return greetings[lvl - 1];
  }

  function oralSpeak(text) {
    window.speechSynthesis && window.speechSynthesis.cancel();
    setSpeaking(true);
    setLastText(text);
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.88;
    utter.pitch = 1.1;
    utter.volume = 1;
    utter.onend = () => setSpeaking(false);
    utter.onerror = () => setSpeaking(false);
    ttsRef.current = utter;
    window.speechSynthesis && window.speechSynthesis.speak(utter);
  }

  async function sendMessage(userText) {
    if (!userText.trim() || !apiKey) return;
    const wordCount = userText.trim().split(/\s+/).length;
    const starsEarned = wordCount >= 5 ? 3 : wordCount >= 2 ? 2 : 1;

    setSessionTurns(t => t + 1);
    setSessionWords(w => w + wordCount);

    const newMessages = [...messages, { role: 'user', content: userText }];
    setMessages(newMessages);

    // Show star burst
    const burstId = Date.now();
    setStarBursts(bs => [...bs, { id: burstId, count: starsEarned }]);
    setTimeout(() => setStarBursts(bs => bs.filter(b => b.id !== burstId)), 900);

    const newStars = stars + starsEarned;
    setStars(newStars);
    setTotalStars(ts => ts + starsEarned);

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 200,
          system: buildSystemPrompt(level),
          messages: newMessages,
        }),
      });
      const data = await resp.json();
      const reply = data.content?.[0]?.text || "Wonderful! You are amazing! Can you tell me more?";
      setMessages(m => [...m, { role: 'assistant', content: reply }]);
      oralSpeak(reply);
    } catch(e) {
      const fallback = "Amazing! You are doing so well! Can you tell me something else?";
      setMessages(m => [...m, { role: 'assistant', content: fallback }]);
      oralSpeak(fallback);
    }

    if (newStars >= levelData.stars) {
      setTimeout(() => {
        setStars(0);
        setView('fishgame');
      }, 2000);
    }
  }

  function levelUp() {
    setCelebrating(true);
    const newProgress = [...levelProgress];
    newProgress[level - 1] = 1;
    setLevelProgress(newProgress);
    const nextLevel = Math.min(level + 1, 10);
    setCelebrationMsg(level >= 10
      ? "🏆 You are an Oral Master! Incredible achievement!"
      : `🎉 Level ${level} complete! Welcome to Level ${nextLevel} — ${LEVELS[nextLevel-1].name}!`
    );
    setShowCelebration(true);
    setTimeout(() => {
      setLevel(nextLevel);
      setMessages([]);
      setStars(0);
      setCelebrating(false);
      setShowCelebration(false);
      setView('talk');
    }, 5000);
  }

  function startMic() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      setTypingMode(true);
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = 'en-GB';
    rec.onstart = () => setListening(true);
    rec.onend = () => setListening(false);
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      sendMessage(text);
    };
    rec.onerror = () => setListening(false);
    recognitionRef.current = rec;
    rec.start();
  }

  function stopMic() {
    recognitionRef.current?.stop();
    setListening(false);
  }

  function handleApiKeySubmit() {
    if (!apiKeyInput.trim()) return;
    setApiKey(apiKeyInput.trim());
    setShowApiKeyScreen(false);
  }

  // ── Render ────────────────────────────────────────────────────────────────
  if (showApiKeyScreen) {
    return (
      <div className="apikey-screen">
        <div className="apikey-box">
          <div className="welcome-fish">🐠</div>
          <div className="apikey-title">Welcome to Oral!</div>
          <p style={{color:'#a0a0c0',marginBottom:20,fontSize:'.95rem',lineHeight:1.6}}>
            Oral uses Claude AI to have real conversations.<br/>
            Please enter your Anthropic API key to get started.
          </p>
          <input
            className="apikey-input"
            type="password"
            placeholder="sk-ant-api..."
            value={apiKeyInput}
            onChange={e => setApiKeyInput(e.target.value)}
            onKeyDown={e => e.key==='Enter' && handleApiKeySubmit()}
          />
          <button className="btn btn-primary" style={{width:'100%'}} onClick={handleApiKeySubmit}>
            Let's Begin! 🚀
          </button>
          <div className="apikey-note">
            Your key is stored locally on this device only and never sent anywhere except the Anthropic API.
            Get a key at console.anthropic.com
          </div>
        </div>
      </div>
    );
  }

  if (view === 'welcome') {
    return (
      <div className="welcome-bg">
        <div className="welcome-fish">🐠</div>
        <div className="welcome-title">Oral</div>
        <div className="welcome-sub">A magical speech companion for children.<br/>Talk to Oral, earn stars, play the fish game!</div>
        <div style={{display:'flex',gap:16,flexWrap:'wrap',justifyContent:'center',marginTop:8}}>
          <button className="btn btn-primary" onClick={() => setView('wizard')}>Let's Get Started! 🌟</button>
          <button className="btn" style={{background:'rgba(255,255,255,.1)',color:'#fff'}} onClick={() => { setDashUnlocked(false); setView('dashboard'); }}>
            📊 Parent / Carer Area
          </button>
        </div>
        <div style={{marginTop:16,fontSize:'.8rem',color:'rgba(255,255,255,.35)'}}>
          Oral v2.0 — Speech & Language Companion
        </div>
      </div>
    );
  }

  if (view === 'wizard') {
    return (
      <div className="wizard-wrap">
        <div className="wizard-box">
          <div className="wizard-title">🌟 Let's Find the Right Starting Level</div>
          {wizardChoice === null ? (
            <>
              <div className="wizard-q">Which best describes your child's speech right now?</div>
              {WIZARD_OPTIONS.map((opt, i) => (
                <div
                  key={i}
                  className={`wizard-option${wizardChoice === i ? ' selected' : ''}`}
                  onClick={() => { setWizardChoice(i); setWizardLevel(i + 1); }}
                >
                  <div className="wizard-option-num">{i + 1}</div>
                  <div className="wizard-option-text">{opt}</div>
                </div>
              ))}
            </>
          ) : (
            <div className="level-confirm">
              <div style={{fontSize:'1rem',color:'#a0a0c0',marginBottom:8}}>We recommend starting at</div>
              <div className="level-name">{LEVELS[wizardLevel-1].emoji} Level {wizardLevel} — {LEVELS[wizardLevel-1].name}</div>
              <div className="level-desc">{LEVELS[wizardLevel-1].desc}</div>
              <div className="level-adj">
                <button className="adj-btn" onClick={() => setWizardLevel(l => Math.max(1, l-1))}>−</button>
                <div className="adj-num">{wizardLevel}</div>
                <button className="adj-btn" onClick={() => setWizardLevel(l => Math.min(10, l+1))}>+</button>
              </div>
              <button className="btn btn-green" onClick={() => {
                setLevel(wizardLevel);
                setStars(0);
                setMessages([]);
                setView('talk');
              }}>
                Start at Level {wizardLevel}! 🚀
              </button>
              <br/><br/>
              <button className="btn btn-sm" style={{background:'rgba(255,255,255,.1)',color:'#ccc'}} onClick={() => setWizardChoice(null)}>← Back</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (view === 'talk') {
    const pct = Math.min((stars / levelData.stars) * 100, 100);
    return (
      <div style={{position:'relative',width:'100%',height:'100%',background:'#87CEEB'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}}/>
        <div className="talk-overlay">
          <div className="talk-top">
            <div className="level-badge">{levelData.emoji} Level {level}: {levelData.name}</div>
            <div className="stars-bar">
              <div className="stars-label">⭐ Stars to fish game!</div>
              <div className="stars-track"><div className="stars-fill" style={{width:`${pct}%`}}/></div>
              <div className="star-count">{stars} / {levelData.stars} stars</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="icon-btn" title="Change Level" onClick={() => { setWizardChoice(null); setView('wizard'); }}>⚙️</button>
              <button className="icon-btn" title="Parent Area" onClick={() => { setDashUnlocked(false); setView('dashboard'); }}>📊</button>
            </div>
          </div>

          <div style={{flex:1}}/>

          {starBursts.map(b => (
            <div key={b.id} className="star-burst" style={{bottom:'100px',left:'50%',transform:'translateX(-50%)'}}>
              {'⭐'.repeat(b.count)}
            </div>
          ))}

          <div className="talk-bottom">
            {typingMode ? (
              <div className="input-row">
                <input
                  className="text-input"
                  value={textInput}
                  onChange={e => setTextInput(e.target.value)}
                  placeholder="Type what you want to say..."
                  onKeyDown={e => { if(e.key==='Enter' && textInput.trim()) { sendMessage(textInput); setTextInput(''); }}}
                />
                <button className="send-btn" onClick={() => { if(textInput.trim()) { sendMessage(textInput); setTextInput(''); }}}>➤</button>
                <button className="icon-btn" onClick={() => setTypingMode(false)} title="Use microphone">🎤</button>
              </div>
            ) : (
              <div className="input-row">
                <button
                  className={`mic-btn ${listening ? 'mic-active' : 'mic-idle'}`}
                  onMouseDown={startMic}
                  onMouseUp={stopMic}
                  onTouchStart={startMic}
                  onTouchEnd={stopMic}
                  title={listening ? 'Listening...' : 'Hold to speak'}
                >
                  {listening ? '🔴' : '🎤'}
                </button>
                <div style={{flex:1,textAlign:'center'}}>
                  <div style={{color:'rgba(255,255,255,.7)',fontSize:'.9rem'}}>
                    {listening ? '🎙️ Listening... speak now!' : 'Hold the mic button and speak to Oral!'}
                  </div>
                  <button className="type-toggle" onClick={() => setTypingMode(true)}>✍️ Type instead</button>
                </div>
              </div>
            )}
          </div>
        </div>

        {showCelebration && (
          <div className="celebration">
            <Confetti/>
            <div className="celebration-emoji">🎉</div>
            <div className="celebration-title">{celebrationMsg}</div>
            <div style={{fontSize:'1rem',color:'#a0a0c0'}}>Get ready for your next adventure...</div>
          </div>
        )}
      </div>
    );
  }

  if (view === 'fishgame') {
    const fishTotal = levelData.fish;
    const pct = Math.min((fishMoved / fishTotal) * 100, 100);
    return (
      <div style={{position:'relative',width:'100%',height:'100%',background:'#010820'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}}/>
        <div className="fish-overlay">
          <div className="fish-top">
            <div style={{color:'#4488FF',fontWeight:700,fontSize:'1rem'}}>🐠 Fish Move Game!</div>
            <div className="fish-progress-wrap">
              <div className="fish-progress-label">{fishMoved}/{fishTotal} fish moved! 🐟</div>
              <div className="fish-track"><div className="fish-fill" style={{width:`${pct}%`}}/></div>
            </div>
            <div style={{fontSize:'.8rem',color:'#607090'}}>Level {level}</div>
          </div>
        </div>
        <div className="fish-hint">👆 Tap a fish in the left tank to move it!</div>

        {showCelebration && (
          <div className="celebration">
            <Confetti/>
            <div className="celebration-emoji">🏆</div>
            <div className="celebration-title">{celebrationMsg}</div>
          </div>
        )}
      </div>
    );
  }

  if (view === 'dashboard') {
    if (!dashUnlocked) {
      return (
        <div style={{position:'relative',width:'100%',height:'100%',background:'linear-gradient(135deg,#0f0c29,#1a0533)'}}>
          <div className="pin-screen">
            <div style={{fontSize:'2rem'}}>🔒</div>
            <div className="pin-title">Parent / Carer Area</div>
            <div style={{color:'#a0a0c0',fontSize:'.9rem'}}>Enter PIN to continue</div>
            <input
              className="pin-input"
              type="password"
              maxLength={4}
              value={pinInput}
              onChange={e => { setPinInput(e.target.value); setPinError(''); }}
              placeholder="••••"
              onKeyDown={e => {
                if (e.key==='Enter') {
                  if (pinInput === '1234') { setDashUnlocked(true); setPinInput(''); }
                  else setPinError('Incorrect PIN. Default is 1234');
                }
              }}
            />
            {pinError && <div className="pin-error">{pinError}</div>}
            <button className="btn btn-primary" onClick={() => {
              if (pinInput === '1234') { setDashUnlocked(true); setPinInput(''); }
              else setPinError('Incorrect PIN. Default is 1234');
            }}>Enter</button>
            <button className="btn btn-sm" style={{background:'rgba(255,255,255,.1)',color:'#ccc',marginTop:8}} onClick={() => setView('welcome')}>← Back</button>
          </div>
        </div>
      );
    }

    return (
      <div className="dash-wrap">
        <div className="dash-box">
          <div className="dash-title">📊 Parent & Carer Dashboard</div>

          <div className="dash-section">
            <div className="dash-section-title">Current Progress</div>
            <div className="stat-grid">
              <div className="stat-card">
                <div className="stat-val">{level}/10</div>
                <div className="stat-label">Current Level</div>
              </div>
              <div className="stat-card">
                <div className="stat-val">{totalStars}</div>
                <div className="stat-label">Total Stars Earned</div>
              </div>
              <div className="stat-card">
                <div className="stat-val">{sessionTurns}</div>
                <div className="stat-label">Session Turns</div>
              </div>
              <div className="stat-card">
                <div className="stat-val">{sessionWords}</div>
                <div className="stat-label">Words This Session</div>
              </div>
            </div>
          </div>

          <div className="dash-section">
            <div className="dash-section-title">Level Progress</div>
            {LEVELS.map((l, i) => (
              <div className="level-row" key={l.num}>
                <div className="level-row-name">{l.emoji} {l.name}</div>
                <div className="level-row-track">
                  <div className="level-row-fill" style={{width: i < level-1 ? '100%' : i === level-1 ? `${Math.min((stars/l.stars)*100,100)}%` : '0%'}}/>
                </div>
                <div className="level-row-status">
                  {i < level-1 ? '✅' : i === level-1 ? `L${level}` : '🔒'}
                </div>
              </div>
            ))}
          </div>

          <div className="dash-section">
            <div className="dash-section-title">Session Recommendations</div>
            <div className="info-box">
              ⏱️ <strong>Duration:</strong> 10–15 minutes per session<br/>
              📅 <strong>Frequency:</strong> 3–5 sessions per week<br/>
              🔇 <strong>Environment:</strong> Quiet room, minimal background noise<br/>
              👀 <strong>Supervision:</strong> Sit with your child for best results<br/>
              💻 <strong>Browser:</strong> Chrome or Edge for speech recognition
            </div>
          </div>

          <div className="dash-section">
            <div className="dash-section-title">Therapy Approach</div>
            <div className="info-box">
              Oral uses evidence-based speech therapy methods: <strong>Model-Expand</strong>, <strong>Positive Reinforcement</strong>, and <strong>Progressive Scaffolding</strong>. Every attempt is celebrated. Oral never corrects pronunciation or expresses disappointment.<br/><br/>
              <strong>⚠️ Important:</strong> Oral supplements but does not replace a qualified Speech and Language Therapist (SLT).
            </div>
          </div>

          <div className="dash-section">
            <div className="dash-section-title">Safeguarding</div>
            <div className="info-box">
              If a child mentions being hurt or in danger, Oral responds: <em>"Please find a grown-up right now! They will help you!"</em> and redirects. No personal data is collected or stored server-side.
            </div>
          </div>

          <div style={{display:'flex',gap:12,justifyContent:'center',marginTop:8,flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={() => { setDashUnlocked(false); setView('talk'); }}>▶ Back to Oral</button>
            <button className="btn" style={{background:'rgba(255,255,255,.1)',color:'#ccc'}} onClick={() => { setWizardChoice(null); setDashUnlocked(false); setView('wizard'); }}>⚙️ Change Level</button>
            <button className="btn" style={{background:'rgba(255,255,255,.1)',color:'#ccc'}} onClick={() => { setDashUnlocked(false); setView('welcome'); }}>🏠 Home</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<OralApp/>);
</script>
</body>
</html>
