<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ocean Voices 🌊</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --deep: #0a1628;
    --ocean: #0d4f7c;
    --teal: #00a8a8;
    --light: #7fd7e8;
    --gold: #ffd700;
    --coral: #ff6b6b;
    --cream: #fffdf5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--deep);
    color: var(--cream);
    user-select: none;
  }
  #bgCanvas { position: fixed; inset: 0; z-index: 0; }
  .app { position: relative; z-index: 1; height: 100%; width: 100%; overflow-y: auto; }
  .center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 24px; text-align: center; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    min-height: 56px; border-radius: 50px; padding: 16px 32px; font-size: 20px; font-weight: 800;
    color: #fff; background: linear-gradient(135deg, var(--teal), var(--ocean));
    box-shadow: 0 8px 20px rgba(0,168,168,.35); transition: transform .15s, box-shadow .15s; margin: 8px;
  }
  .btn:active { transform: scale(.95); }
  .btn.gold { background: linear-gradient(135deg, var(--gold), #ffb300); color: #4a3000; box-shadow: 0 8px 20px rgba(255,215,0,.4); }
  .btn.coral { background: linear-gradient(135deg, var(--coral), #e85555); }
  .btn.ghost { background: rgba(255,255,255,.12); box-shadow: none; border: 2px solid rgba(255,255,255,.3); }
  .btn.sm { min-height: 44px; padding: 10px 18px; font-size: 15px; border-radius: 30px; }

  .logo { font-size: 64px; font-weight: 900; text-shadow: 0 4px 24px rgba(0,168,168,.6); letter-spacing: 1px; }
  .tagline { font-size: 18px; opacity: .9; margin: 12px 0 32px; max-width: 460px; line-height: 1.5; }

  .card {
    background: rgba(13,79,124,.55); backdrop-filter: blur(10px); border: 1px solid rgba(127,215,232,.25);
    border-radius: 16px; padding: 20px; margin: 10px 0;
  }
  .panel {
    background: rgba(10,22,40,.82); backdrop-filter: blur(14px); border: 1px solid rgba(127,215,232,.3);
    border-radius: 24px; padding: 28px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  h2 { font-size: 26px; margin-bottom: 6px; }
  .sub { opacity: .8; margin-bottom: 20px; font-size: 15px; }
  label { display: block; font-weight: 700; margin: 16px 0 6px; font-size: 15px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px solid rgba(127,215,232,.4);
    background: rgba(255,255,255,.95); color: var(--deep); font-size: 18px; font-weight: 700; font-family: inherit;
  }
  input[type=range] { width: 100%; accent-color: var(--teal); height: 40px; }
  .pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    padding: 14px; border-radius: 14px; border: 2px solid rgba(127,215,232,.3); background: rgba(255,255,255,.06);
    font-weight: 700; font-size: 15px; text-align: center; min-height: 56px; display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .opt.active { background: var(--teal); border-color: var(--light); box-shadow: 0 6px 16px rgba(0,168,168,.4); }
  .opt.big { font-size: 38px; flex-direction: column; gap: 4px; }
  .opt.big span { font-size: 14px; }

  .steps { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .dot.on { background: var(--gold); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .toggle { width: 56px; height: 32px; border-radius: 20px; background: rgba(255,255,255,.25); position: relative; transition: background .2s; flex: 0 0 auto; }
  .toggle.on { background: var(--teal); }
  .toggle .knob { width: 26px; height: 26px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .2s; }
  .toggle.on .knob { left: 27px; }

  /* Child world */
  .topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 16px; z-index: 5; }
  .badge { background: rgba(10,22,40,.7); backdrop-filter: blur(8px); border-radius: 30px; padding: 10px 18px; font-weight: 800; font-size: 17px; border: 1px solid rgba(127,215,232,.3); }
  .companion { font-size: 120px; line-height: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-18px) } }
  .companion.happy { animation: happy .5s ease-in-out infinite; }
  @keyframes happy { 0%,100%{ transform: translateY(0) rotate(-6deg) } 50%{ transform: translateY(-30px) rotate(6deg) } }
  .speech {
    background: var(--cream); color: var(--deep); border-radius: 24px; padding: 18px 24px; max-width: 420px;
    font-size: 22px; font-weight: 800; line-height: 1.35; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,.3); margin-bottom: 14px;
  }
  .speech::after { content: ""; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); border: 14px solid transparent; border-top-color: var(--cream); border-bottom: none; }
  .listening { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow: 0 12px 30px rgba(0,168,168,.3) } 50%{ box-shadow: 0 12px 40px rgba(0,168,168,.8) } }

  .bottombar { position: absolute; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 14px; justify-content: center; flex-wrap: wrap; z-index: 5; background: linear-gradient(transparent, rgba(10,22,40,.6)); }
  .actbtn { min-width: 70px; min-height: 64px; border-radius: 18px; background: rgba(13,79,124,.85); border: 1px solid rgba(127,215,232,.3); color:#fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 26px; font-weight: 700; }
  .actbtn span { font-size: 11px; }
  .mic { min-width: 84px; background: linear-gradient(135deg, var(--coral), #e85555); font-size: 32px; box-shadow: 0 6px 18px rgba(255,107,107,.5); }
  .mic.on { animation: pulse 1s infinite; }

  .wave { display: flex; gap: 4px; align-items: flex-end; height: 40px; justify-content: center; margin: 10px 0; }
  .wave i { width: 6px; background: var(--teal); border-radius: 4px; animation: wv .8s ease-in-out infinite; }
  @keyframes wv { 0%,100%{ height: 8px } 50%{ height: 36px } }

  .pecs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; max-width: 480px; margin: 0 auto; }
  .pecs { background: var(--cream); color: var(--deep); border-radius: 16px; padding: 14px 8px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 90px; }
  .pecs .e { font-size: 40px; }
  .pecs .t { font-size: 14px; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10,22,40,.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
  .modal { width: 100%; max-width: 560px; }
  .celebrate { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .celebrate .txt { font-size: 44px; font-weight: 900; color: var(--gold); text-shadow: 0 4px 20px rgba(0,0,0,.5); animation: pop .6s ease; }
  @keyframes pop { 0%{ transform: scale(0) } 60%{ transform: scale(1.2) } 100%{ transform: scale(1) } }
  .confetti { position: absolute; font-size: 30px; animation: fall 1.4s ease-in forwards; }
  @keyframes fall { 0%{ transform: translateY(-40px) scale(.5); opacity: 1 } 100%{ transform: translateY(60vh) scale(1.3); opacity: 0 } }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { padding: 10px 16px; border-radius: 30px; background: rgba(255,255,255,.08); font-weight: 700; font-size: 14px; }
  .tab.on { background: var(--teal); }
  .stat { background: rgba(13,79,124,.5); border-radius: 16px; padding: 16px; text-align: center; }
  .stat .n { font-size: 32px; font-weight: 900; color: var(--light); }
  .stat .l { font-size: 13px; opacity: .85; margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bar-track { height: 14px; border-radius: 10px; background: rgba(255,255,255,.15); overflow: hidden; margin: 8px 0; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--light)); border-radius: 10px; transition: width .4s; }
  .tip { display: flex; gap: 12px; align-items: flex-start; }
  .tip .ic { font-size: 28px; }
  .crt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 12px; }
  .crt { background: rgba(13,79,124,.5); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(127,215,232,.25); }
  .crt .e { font-size: 46px; }
  .crt .n { font-weight: 800; margin-top: 6px; }
  .crt .d { font-size: 11px; opacity: .7; margin-top: 2px; }
  .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 18px 0; }
  .pin-dots div { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--light); }
  .pin-dots div.f { background: var(--gold); border-color: var(--gold); }
  .keypad { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
  .keypad button { min-height: 56px; font-size: 24px; font-weight: 800; border-radius: 14px; background: rgba(255,255,255,.1); color: #fff; }
  .scroll { max-height: 88vh; overflow-y: auto; }
  .gameopt { background: var(--cream); color: var(--deep); border-radius: 18px; padding: 18px; font-size: 40px; font-weight: 800; display:flex; flex-direction:column; align-items:center; gap:6px; min-height: 100px; }
  .gameopt span { font-size: 16px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(127,215,232,.4); border-radius: 4px; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------------- Canvas underwater background ---------------- */
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, bubbles = [], particles = [], fish = [], t = 0;
  function reduced() { try { return JSON.parse(localStorage.getItem('oceanVoices')||'{}').sensoryMode; } catch(e){ return false; } }
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  function rnd(a,b){ return a + Math.random()*(b-a); }
  for (let i=0;i<28;i++) bubbles.push({ x: rnd(0,W), y: rnd(0,H), r: rnd(5,15), sp: rnd(.3,1.1), drift: rnd(-.3,.3) });
  for (let i=0;i<40;i++) particles.push({ x: rnd(0,W), y: rnd(0,H), r: rnd(.5,2), ph: rnd(0,6.28), sp: rnd(.002,.01) });
  const fishEmo = ['🐟','🐠','🐡'];
  for (let i=0;i<4;i++) fish.push({ x: rnd(0,W), y: rnd(60,H-120), sp: rnd(.2,.6)*(Math.random()<.5?-1:1), e: fishEmo[i%3], s: rnd(20,38) });
  function loop() {
    t++;
    const r = reduced();
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a1628'); g.addColorStop(.5,'#0d4f7c'); g.addColorStop(1,'#063a5a');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.save();
    const rayCount = r ? 2 : 4;
    for (let i=0;i<rayCount;i++) {
      const x = (W/rayCount)*i + Math.sin(t*0.005 + i)*40;
      const grd = ctx.createLinearGradient(x, 0, x+120, H);
      grd.addColorStop(0,'rgba(127,215,232,0.10)'); grd.addColorStop(1,'rgba(127,215,232,0)');
      ctx.fillStyle = grd; ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x+80,0); ctx.lineTo(x+200,H); ctx.lineTo(x+40,H); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if (!r) particles.forEach(p => {
      p.ph += p.sp; const a = (Math.sin(p.ph)+1)/2;
      ctx.fillStyle = `rgba(127,215,232,${0.1+a*0.5})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
    });
    fish.forEach(f => {
      f.x += f.sp * (r?0.4:1);
      if (f.x>W+40) f.x=-40; if (f.x<-40) f.x=W+40;
      ctx.save(); ctx.globalAlpha=.5; ctx.font = f.s+'px serif';
      if (f.sp<0){ ctx.translate(f.x,f.y); ctx.scale(-1,1); ctx.fillText(f.e,0,0);} else ctx.fillText(f.e,f.x,f.y);
      ctx.restore();
    });
    bubbles.forEach(b => {
      b.y -= b.sp*(r?0.4:1); b.x += Math.sin(t*0.02+b.y*0.01)*b.drift;
      if (b.y < -20){ b.y = H+20; b.x = rnd(0,W); }
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.stroke();
      ctx.fillStyle='rgba(127,215,232,0.08)'; ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ---------------- State / persistence ---------------- */
const DEFAULT = {
  childName: "Friend", childAge: 4, ageBand: 1, communicationLevel: 2,
  interests: [], sensoryMode: false, pecsMode: false,
  companionName: "Shelly", companionType: "turtle", personality: "playful",
  stage: 1, wordsAttempted: [], wordsMastered: [],
  aquarium: [
    { type: "turtle", emoji: "🐢", name: "Shelly the Turtle", date: "Starter" },
    { type: "clownfish", emoji: "🐠", name: "Finn the Clownfish", date: "Starter" },
    { type: "seahorse", emoji: "🦄", name: "Coral the Seahorse", date: "Starter" }
  ],
  totalAttempts: 0, totalSessions: 0, sessionHistory: [], sessionLimit: 20, setupDone: false
};
function loadState() {
  try { const s = JSON.parse(localStorage.getItem('oceanVoices')); return s ? { ...DEFAULT, ...s } : { ...DEFAULT }; }
  catch(e) { return { ...DEFAULT }; }
}
function saveState(s) { localStorage.setItem('oceanVoices', JSON.stringify(s)); }

const COMPANION_EMOJI = { turtle:"🐢", dolphin:"🐬", octopus:"🐙", whale:"🐋" };
const INTERESTS = [
  {id:"turtles",label:"Sea turtles 🐢"},{id:"dolphins",label:"Dolphins 🐬"},
  {id:"octopuses",label:"Octopuses 🐙"},{id:"sharks",label:"Sharks 🦈"},
  {id:"seahorses",label:"Seahorses 🦄"},{id:"treasure",label:"Treasure 💎"},
  {id:"colours",label:"Colours 🌈"},{id:"counting",label:"Counting 🔢"}
];
const COMM_LEVELS = [
  "Uses single sounds/gestures only","Uses single words","Uses 2-3 word phrases",
  "Uses short sentences","Has conversational language"
];
const STAGE_NAMES = ["", "Single Words", "Two-Word Phrases", "Short Sentences", "Conversations", "Fluent Chatter"];

/* ---------------- Speech recognition hook ---------------- */
function useSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recRef = useRef(null);
  const available = !!SR;
  const listen = useCallback((onResult, onEnd) => {
    if (!SR) { onEnd && onEnd(null); return; }
    try {
      const r = new SR(); recRef.current = r;
      r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3;
      let got = null;
      r.onresult = e => { got = e.results[0][0].transcript.toLowerCase().trim(); onResult(got); };
      r.onend = () => onEnd && onEnd(got);
      r.onerror = () => {};
      r.start();
    } catch(e) { onEnd && onEnd(null); }
  }, [SR]);
  const stop = useCallback(() => { try { recRef.current && recRef.current.stop(); } catch(e){} }, []);
  return { available, listen, stop };
}

/* ---------------- Helpers ---------------- */
function ageBandFor(age){ return age<=5?1:age<=7?2:3; }
function ageBandName(b){ return b===1?"Early Learners":b===2?"Developing Communicators":"Growing Communicators"; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function levenshtein(a,b){
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
function matchTier(said, target) {
  if (!said) return "silence";
  const t = target.toLowerCase();
  if (said === t || said.split(/\s+/).includes(t)) return "exact";
  if (said.includes(t) || t.includes(said) || levenshtein(said, t) <= 2) return "close";
  return "any";
}

/* ---------------- Celebration overlay ---------------- */
function Celebration({ text }) {
  const items = ["⭐","🫧","💙","🌟","✨","🐠","💎","🌊"];
  return (
    <div className="celebrate">
      {[...Array(16)].map((_,i)=>(
        <div key={i} className="confetti" style={{ left: (5+i*6)+"%", animationDelay: (i*0.04)+"s", top: "10%" }}>
          {items[i%items.length]}
        </div>
      ))}
      <div className="txt">{text}</div>
    </div>
  );
}
function celebrateInline(setMsg, txt) { setMsg(txt); setTimeout(()=>setMsg(null), 1400); }

/* ---------------- Welcome ---------------- */
function Welcome({ onChild, onParent }) {
  return (
    <div className="center-col">
      <div className="logo">🌊 Ocean Voices</div>
      <div className="tagline">A magical underwater friendship that quietly teaches communication</div>
      <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center'}}>
        <button className="btn gold" onClick={onChild}>Start Adventure 🐠</button>
        <button className="btn ghost" onClick={onParent}>Parent Setup ⚙️</button>
      </div>
    </div>
  );
}

/* ---------------- Setup Wizard ---------------- */
function Wizard({ state, setState, onDone }) {
  const [step, setStep] = useState(1);
  const [d, setD] = useState({ ...state });
  const up = (k,v)=> setD(p=>({ ...p, [k]:v }));
  const toggleArr = (k,v)=> setD(p=>({ ...p, [k]: p[k].includes(v) ? p[k].filter(x=>x!==v) : [...p[k],v] }));
  const next = ()=> setStep(s=>Math.min(4,s+1));
  const back = ()=> setStep(s=>Math.max(1,s-1));
  const band = ageBandFor(d.childAge);
  const save = () => {
    const ns = { ...state, ...d, ageBand: band, setupDone: true };
    setState(ns); saveState(ns); onDone();
  };
  return (
    <div className="center-col">
      <div className="panel scroll">
        <div className="steps">{[1,2,3,4].map(i=><div key={i} className={"dot"+(i<=step?" on":"")}/>)}</div>

        {step===1 && <>
          <h2>Child Profile</h2><div className="sub">Tell us about your child</div>
          <label>Child's name</label>
          <input type="text" value={d.childName} onChange={e=>up('childName',e.target.value)} />
          <label>Age: {d.childAge}</label>
          <input type="range" min="3" max="10" value={d.childAge} onChange={e=>up('childAge',+e.target.value)} />
          <div className="card" style={{marginTop:14}}>
            <b>Age Band:</b> {ageBandName(band)} <br/>
            <small style={{opacity:.8}}>Band {band} ({band===1?"3-5":band===2?"6-7":"8-10"} years)</small>
          </div>
        </>}

        {step===2 && <>
          <h2>Communication Level</h2><div className="sub">How does your child usually communicate?</div>
          {COMM_LEVELS.map((c,i)=>(
            <div key={i} className={"opt"+(d.communicationLevel===i+1?" active":"")} style={{marginBottom:8}}
                 onClick={()=>up('communicationLevel',i+1)}>{c}</div>
          ))}
        </>}

        {step===3 && <>
          <h2>Interests & Sensory</h2><div className="sub">Pick what your child loves</div>
          <div className="pill-grid">
            {INTERESTS.map(it=>(
              <div key={it.id} className={"opt"+(d.interests.includes(it.id)?" active":"")} onClick={()=>toggleArr('interests',it.id)}>{it.label}</div>
            ))}
          </div>
          <div className="card row" style={{marginTop:16}}>
            <div><b>Reduced sensory mode</b><br/><small style={{opacity:.8}}>Less animation, quieter</small></div>
            <div className={"toggle"+(d.sensoryMode?" on":"")} onClick={()=>up('sensoryMode',!d.sensoryMode)}><div className="knob"/></div>
          </div>
          <div className="card row">
            <div><b>Touch / PECS mode</b><br/><small style={{opacity:.8}}>No speech required</small></div>
            <div className={"toggle"+(d.pecsMode?" on":"")} onClick={()=>up('pecsMode',!d.pecsMode)}><div className="knob"/></div>
          </div>
        </>}

        {step===4 && <>
          <h2>Companion Setup</h2><div className="sub">Create your ocean friend</div>
          <label>Companion name</label>
          <input type="text" value={d.companionName} onChange={e=>up('companionName',e.target.value)} />
          <label>Companion type</label>
          <div className="pill-grid">
            {Object.entries(COMPANION_EMOJI).map(([k,e])=>(
              <div key={k} className={"opt big"+(d.companionType===k?" active":"")} onClick={()=>up('companionType',k)}>
                {e}<span>{k}</span>
              </div>
            ))}
          </div>
          <label>Personality</label>

            ))}

        <div className="row" style={{marginTop:22}}>

/* ---------------- Dialogue / scaffolding ---------------- */
const WORD_BANK = [
  {word:"fish", emoji:"🐟"},{word:"turtle", emoji:"🐢"},{word:"dolphin", emoji:"🐬"},
  {word:"crab", emoji:"🦀"},{word:"star", emoji:"⭐"},{word:"blue", emoji:"🔵"},
  {word:"octopus", emoji:"🐙"},{word:"shell", emoji:"🐚"},{word:"whale", emoji:"🐋"}
];
function buildPrompt(level, target) {
  const w = target.word.toUpperCase();
  switch(level){
    case 1: return `Can you say... ${w}? ${target.emoji}`;
    case 2: return `Look, it's a ___ ! Can you say ${w}? ${target.emoji}`;
    case 3: return `What is this ${target.emoji}? Can you tell me?`;
    case 4: return `Wow, look who's here ${target.emoji}! What do you see?`;
    default: return `Hi! Tell me all about this friend ${target.emoji}!`;
  }
}
const REWARD_POOL = [
  {type:"jelly",emoji:"🪼",name:"Glow the Jellyfish"},{type:"shark",emoji:"🦈",name:"Chomp the Shark"},
  {type:"crab",emoji:"🦀",name:"Pinch the Crab"},{type:"octopus",emoji:"🐙",name:"Ollie the Octopus"},
  {type:"whale",emoji:"🐋",name:"Bloo the Whale"},{type:"dolphin",emoji:"🐬",name:"Splash the Dolphin"},
  {type:"starfish",emoji:"⭐",name:"Twinkle the Starfish"},{type:"pufferfish",emoji:"🐡",name:"Puffy the Pufferfish"}
];
function addReward(setState) {
  setState(prev => {
    const got = REWARD_POOL[(prev.aquarium.length - 3 + REWARD_POOL.length) % REWARD_POOL.length];
    const ns = { ...prev, aquarium: [...prev.aquarium, { ...got, date: todayStr() }] };
    saveState(ns); return ns;
  });
}

/* ---------------- Main Underwater World ---------------- */
function World({ state, setState, openGame, openAquarium, openParent }) {
  const [mood, setMood] = useState("GREETING");
  const [text, setText] = useState("");
  const [target, setTarget] = useState(WORD_BANK[0]);
  const [celebrate, setCelebrate] = useState(null);
  const speech = useSpeech();
  const pecs = state.pecsMode || !speech.available;
  const compEmoji = COMPANION_EMOJI[state.companionType] || "🐢";

  useEffect(() => {
    setText(`Hi ${state.childName}! I've been waiting for you! Ready to explore the ocean? 🌊`);
    setState(prev => { const ns = { ...prev, totalSessions: prev.totalSessions + 1 }; saveState(ns); return ns; });
    const t = setTimeout(()=> newTarget(), 3200);
    return ()=> clearTimeout(t);
  // eslint-disable-next-line
  }, []);

  function newTarget() {
    const w = WORD_BANK[Math.floor(Math.random()*WORD_BANK.length)];
    setTarget(w); setMood("WAITING"); setText(buildPrompt(state.communicationLevel, w));
  }

  function recordAttempt(word, mastered) {
    setState(prev => {
      const wa = prev.wordsAttempted.includes(word) ? prev.wordsAttempted : [...prev.wordsAttempted, word];
      const wm = mastered && !prev.wordsMastered.includes(word) ? [...prev.wordsMastered, word] : prev.wordsMastered;
      const hist = [...prev.sessionHistory];
      const today = todayStr();
      const idx = hist.findIndex(h=>h.date===today);
      if (idx>=0) hist[idx] = { ...hist[idx], attempts: hist[idx].attempts+1 };
      else hist.push({ date: today, attempts: 1 });
      const ns = { ...prev, wordsAttempted: wa, wordsMastered: wm, totalAttempts: prev.totalAttempts+1, sessionHistory: hist };
      saveState(ns); return ns;
    });
  }
  function fire(msg) { setCelebrate(msg); setTimeout(()=>setCelebrate(null), 1600); }

  function evaluate(said) {
    const tier = matchTier(said, target.word);
    if (tier === "exact") {
      setMood("CELEBRATING"); setText(`Amazing! You said ${target.word.toUpperCase()}! ⭐`);
      recordAttempt(target.word, true); addReward(setState); fire("⭐ Amazing! ⭐");
    } else if (tier === "close") {
      setMood("CELEBRATING"); setText(`So close — great trying! ${target.word.toUpperCase()}! 💙`);
      recordAttempt(target.word, false); addReward(setState); fire("💙 Great job! 💙");
    } else if (tier === "any") {
      setMood("ENCOURAGING"); setText(`That's great! Try again! You can do it! 💙`);
      recordAttempt(target.word, false);
    } else {
      setMood("TEACHING"); setText(`Let's try together. Can you say... ${target.word.toUpperCase()}? ${target.emoji}`);
    }
    setTimeout(newTarget, 3000);
  }

  function onMic() {
    if (pecs) return;
    setMood("LISTENING"); setText("I'm listening... 🎤");
    speech.listen(()=>{}, result => evaluate(result));
  }

  const happy = mood === "CELEBRATING";
  return (
    <div style={{height:'100%',position:'relative'}}>
      <div className="topbar">
        <div className="badge">Hi {state.childName}! 👋</div>
        <div className="badge" onClick={openAquarium} style={{cursor:'pointer'}}>🐟 {state.aquarium.length} friends</div>
      </div>

      <div style={{position:'absolute',top:'16%',left:0,right:0,bottom:'120px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',padding:'0 16px'}}>
        <div className={"speech"+(mood==="LISTENING"?" listening":"")}>
          {text}
          {mood==="LISTENING" && <div className="wave">{[...Array(7)].map((_,i)=><i key={i} style={{animationDelay:(i*0.1)+"s"}}/>)}</div>}
        </div>
        <div className={"companion"+(happy?" happy":"")}>{compEmoji}</div>

        {pecs && (mood==="WAITING"||mood==="TEACHING"||mood==="ENCOURAGING") && (
          <div className="pecs-grid" style={{marginTop:18}}>
            {WORD_BANK.slice(0,6).map(w=>(
              <div key={w.word} className="pecs" onClick={()=>evaluate(w.word)}>
                <div className="e">{w.emoji}</div><div className="t">{w.word}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bottombar">
        <button className="actbtn" onClick={()=>openGame('feed')}>🐬<span>Feed</span></button>
        <button className="actbtn" onClick={()=>openGame('bubble')}>🫧<span>Pop</span></button>
        <button className="actbtn" onClick={()=>openGame('find')}>🐢<span>Find</span></button>
        <button className="actbtn" onClick={()=>openGame('name')}>🦑<span>Name</span></button>
        {!pecs && <button className={"actbtn mic"+(mood==="LISTENING"?" on":"")} onClick={onMic}>🎤<span>Speak</span></button>}
        <button className="actbtn" onClick={openParent}>🔒<span>Parent</span></button>
      </div>

      {celebrate && <Celebration text={celebrate} />}
    </div>
  );
}

/* Game 1: Feed the Dolphin */
function FeedGame({ state, onReward, onClose }) {
  const foods = [{w:"fish",e:"🐟"},{w:"seaweed",e:"🌿"},{w:"crab",e:"🦀"},{w:"shrimp",e:"🦐"}];
  const [round, setRound] = useState(0);
  const target = [foods[0].w, foods[3].w, foods[1].w];
  const [msg, setMsg] = useState(null);
  const [happy, setHappy] = useState(false);
  const speech = useSpeech();
  const pecs = state.pecsMode || !speech.available;
  const cur = target[round];
  const curFood = foods.find(f=>f.w===cur);
  function pick(w) {
    const tier = matchTier(w, cur);
    if (tier==="exact" || tier==="close") {
      setHappy(true); celebrateInline(setMsg, "Yum! 🐬");
      setTimeout(()=>{ setHappy(false);
        if (round < 2) setRound(r=>r+1);
        else { onReward(); celebrateInline(setMsg,"⭐ All fed! New friend! ⭐"); setTimeout(onClose,1500); }
      }, 1100);
    } else celebrateInline(setMsg, "Try again! 💙");
  }
  function mic(){ speech.listen(()=>{}, r=>pick(r||"")); }
  return (
    <GameShell title="🐬 Feed the Dolphin" onClose={onClose}>
      <div className="sub" style={{textAlign:'center'}}>Round {round+1} of 3</div>
      <div className={"companion"+(happy?" happy":"")} style={{fontSize:90,textAlign:'center'}}>🐬</div>

  );
}

/* ---------------- Parent Dashboard ---------------- */
function ProgressChart({ history }) {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext('2d'); const W=c.width=c.offsetWidth, H=c.height=200;
    ctx.clearRect(0,0,W,H);
    const days = [];
    for (let i=6;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); const s=dt.toISOString().slice(0,10);
      const h=history.find(x=>x.date===s); days.push({ label:s.slice(5), val:h?h.attempts:0 }); }
    const max = Math.max(1, ...days.map(d=>d.val));
    const bw = W/days.length;
    days.forEach((d,i)=>{
      const bh = (d.val/max)*(H-50);
      const grd = ctx.createLinearGradient(0,H-bh-30,0,H-30);
      grd.addColorStop(0,'#7fd7e8'); grd.addColorStop(1,'#00a8a8');
      ctx.fillStyle=grd;
      ctx.fillRect(i*bw+8, H-bh-30, bw-16, bh);
      ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(d.val, i*bw+bw/2, H-bh-36);
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='10px sans-serif';
      ctx.fillText(d.label, i*bw+bw/2, H-10);
    });
  }, [history]);
  return <canvas ref={ref} style={{width:'100%',height:200,display:'block'}} />;
}

          </select>
          <label>Companion name</label>
          <input type="text" value={state.companionName} onChange={e=>u('companionName',e.target.value)} />
          <label>Companion type</label>
          <select value={state.companionType} onChange={e=>u('companionType',e.target.value)}>
            {Object.keys(COMPANION_EMOJI).map(k=><option key={k} value={k}>{COMPANION_EMOJI[k]} {k}</option>)}
          </select>
          <div className="card row" style={{marginTop:14}}>
            <b>Reduced sensory mode</b>
            <div className={"toggle"+(state.sensoryMode?" on":"")} onClick={()=>u('sensoryMode',!state.sensoryMode)}><div className="knob"/></div>
          </div>
          <div className="card row">
            <b>Touch / PECS mode</b>
            <div className={"toggle"+(state.pecsMode?" on":"")} onClick={()=>u('pecsMode',!state.pecsMode)}><div className="knob"/></div>
          </div>
          <label>Session time limit</label>
          <select value={state.sessionLimit||20} onChange={e=>u('sessionLimit',+e.target.value)}>
            <option value={15}>15 min</option><option value={20}>20 min</option><option value={30}>30 min</option>
          </select>
          <button className="btn coral sm" style={{marginTop:18,width:'100%'}} onClick={()=>{
            if (confirm("Reset all progress? This cannot be undone.")) { localStorage.removeItem('oceanVoices'); location.reload(); }
          }}>Reset Progress</button>
        </>}

        {tab==="Coaching Tips" && <>
          <div className="sub">Tips for: {COMM_LEVELS[state.communicationLevel-1]}</div>
          {tips.map((t,i)=>(
            <div key={i} className="card tip"><div className="ic">💡</div><div>{t}</div></div>
          ))}
        </>}
      </div>
    </div>
  );
}

/* ---------------- Root App ---------------- */
function App() {
  const [state, setState] = useState(loadState);
  const [screen, setScreen] = useState(state.setupDone ? "world" : "welcome");
  const [game, setGame] = useState(null);
  const [showAq, setShowAq] = useState(false);
  const [showParent, setShowParent] = useState(false);
  const reward = () => addReward(setState);
  return (
    <div className="app">
      {screen==="welcome" && <Welcome onChild={()=>setScreen(state.setupDone?"world":"wizard")} onParent={()=>setScreen("wizard")} />}
      {screen==="wizard" && <Wizard state={state} setState={setState} onDone={()=>setScreen("world")} />}
      {screen==="world" && <World state={state} setState={setState}
        openGame={setGame} openAquarium={()=>setShowAq(true)} openParent={()=>setShowParent(true)} />}

      {game==="feed" && <FeedGame state={state} onReward={reward} onClose={()=>setGame(null)} />}
      {game==="bubble" && <BubbleGame state={state} onReward={reward} onClose={()=>setGame(null)} />}
      {game==="find" && <FindGame state={state} onReward={reward} onClose={()=>setGame(null)} />}
      {game==="name" && <NameGame state={state} onReward={reward} onClose={()=>setGame(null)} />}

      {showAq && <Aquarium state={state} onClose={()=>setShowAq(false)} />}
      {showParent && <ParentDash state={state} setState={setState} onClose={()=>setShowParent(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
