<div id="root">

    <div style="font-size:1rem;opacity:.7">Loading…</div>

  </div>
</div>
<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('load-err');
    if (el) { el.style.display='block'; el.textContent='JS Error: ' + (e.message||'unknown') + ' (line '+e.lineno+')'; }
  });
  window.addEventListener('unhandledrejection', function(e) {
    var el = document.getElementById('load-err');
    if (el) { el.style.display='block'; el.textContent='Error: ' + (e.reason||'unknown'); }
  });
  setTimeout(function(){
    var el = document.getElementById('load-err');
    var root = document.getElementById('root');
    if (el && root && root.querySelector('canvas') === null) {
      el.style.display='block';
      el.textContent='App took too long to load. Check internet connection and reload.';
    }
  }, 12000);
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================ AUDIO ============================ */
let QUIET = false, NO_SUDDEN = false;
function playTone(freq, type='sine', dur=0.18, vol=0.15) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.start(); osc.stop(ctx.currentTime+dur);
    setTimeout(()=>ctx.close(), dur*1000+200);
  } catch(e){}
}
function playCelebration(){ if(QUIET||NO_SUDDEN) return; [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.25,0.13),i*90)); }
function playPop(){ if(QUIET) return; playTone(880,'sine',0.1,0.1); }
function playTap(){ if(QUIET) return; playTone(660,'triangle',0.08,0.09); }
function playListening(){ if(QUIET) return; playTone(440,'sine',0.12,0.07); setTimeout(()=>playTone(550,'sine',0.12,0.07),130); }
function playReward(){ if(QUIET||NO_SUDDEN) return; [784,1047,1319].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.3,0.12),i*120)); }

/* ============================ TTS ============================ */
function speak(text, opts={}) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F300}-\u{1FAFF}]|[☀-➿]|[︀-️]/gu,''));
  u.rate = opts.rate||0.88; u.pitch = opts.pitch||1.1; u.volume = (QUIET?0.5:1)*(opts.volume||1);
  const voices = window.speechSynthesis.getVoices();
  let v;
  if (opts.male) v = voices.find(v=>/en[-_](GB|US|AU)/i.test(v.lang)&&/male|daniel|alex|fred|david|james/i.test(v.name));
  if (!v) v = voices.find(v=>/en[-_](GB|US|AU)/i.test(v.lang)&&/female|samantha|karen|victoria|moira|tessa|fiona|kate/i.test(v.name));
  if (!v) v = voices.find(v=>/en[-_]/i.test(v.lang));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined)
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

/* ============================ SPEECH RECOGNITION ============================ */
function useSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recRef = useRef(null);
  const [available, setAvailable] = useState(!!SR);
  const [micError, setMicError] = useState(null);
  const listen = useCallback((onResult, onEnd) => {
    if (!SR) { setAvailable(false); onEnd && onEnd(null); return; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setTimeout(() => {
      try {
        const r = new SR(); recRef.current = r;
        r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
        let got = null;
        r.onresult = e => { got = Array.from(e.results[0]).map(a=>a.transcript).join(' ').toLowerCase().trim(); setMicError(null); onResult(got); };
        r.onend = () => onEnd && onEnd(got);
        r.onerror = e => {
          const msg = e.error;
          if (msg==='not-allowed'||msg==='service-not-allowed') { setAvailable(false); setMicError('Microphone permission denied. Allow mic access in browser settings and reload.'); }
          else if (msg==='network') setMicError('Speech recognition needs https:// or localhost.');
          else if (msg==='audio-capture') setMicError('No microphone found.');
          else if (msg!=='no-speech') setMicError('Mic error: '+msg);
          onEnd && onEnd(null);
        };
        r.start();
      } catch(e) { setMicError('Could not start mic: '+(e.message||e)); onEnd && onEnd(null); }
    }, 200);
  }, [SR]);
  const stop = useCallback(() => { try { recRef.current && recRef.current.stop(); } catch(e){} }, []);
  return { available, listen, stop, micError, setMicError };
}

/* ============================ CANVAS BG ============================ */
function OceanBackground({ reduced, highContrast }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    const nBub = reduced ? 5 : 25;
    const bubbles = Array.from({length:nBub}, () => ({ x:Math.random()*W, y:Math.random()*H, r:2+Math.random()*(reduced?6:9), s:0.2+Math.random()*(reduced?0.5:1.2), drift:Math.random()*0.5-0.25 }));
    const rays = reduced ? [] : Array.from({length:6}, (_,i) => ({ x:(i+0.5)*(W/6), w:30+Math.random()*60, off:Math.random()*W, sp:0.15+Math.random()*0.2 }));
    const fish = reduced ? [] : Array.from({length:8}, () => ({ x:Math.random()*W, y:Math.random()*H, s:0.3+Math.random()*0.7, dir:Math.random()<0.5?-1:1, size:6+Math.random()*10 }));
    const parts = reduced ? [] : Array.from({length:30}, () => ({ x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2, ph:Math.random()*Math.PI*2, sp:0.5+Math.random() }));
    let t = 0;
    function draw() {
      t += 0.016;
      const g = ctx.createLinearGradient(0,0,0,H);
      if (highContrast) { g.addColorStop(0,'#000814'); g.addColorStop(1,'#001233'); }
      else { g.addColorStop(0,'#061428'); g.addColorStop(1,'#0d4f7c'); }
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      rays.forEach(r => { const x = (r.x + r.off + t*r.sp*20) % (W+200) - 100; ctx.save(); ctx.globalAlpha=0.03; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+r.w,0); ctx.lineTo(x+r.w*2.2,H); ctx.lineTo(x+r.w*1.2,H); ctx.closePath(); ctx.fill(); ctx.restore(); });
      parts.forEach(p => { const a = 0.25+0.25*Math.sin(t*p.sp+p.ph); ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#7fd7e8'; ctx.shadowBlur=8; ctx.shadowColor='#00b4b4'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.restore(); });
      fish.forEach(f => { f.x += f.dir*f.s*0.6; if(f.x<-20)f.x=W+20; if(f.x>W+20)f.x=-20; ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle='#0a2540'; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-f.dir*f.size,f.y-f.size/2); ctx.lineTo(f.x-f.dir*f.size,f.y+f.size/2); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(f.x-f.dir*f.size,f.y); ctx.lineTo(f.x-f.dir*f.size*1.6,f.y-f.size/2); ctx.lineTo(f.x-f.dir*f.size*1.6,f.y+f.size/2); ctx.closePath(); ctx.fill(); ctx.restore(); });
      bubbles.forEach(b => { b.y -= b.s; b.x += b.drift; if(b.y<-20){ b.y=H+20; b.x=Math.random()*W; } ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle='#c8f0f8'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke(); ctx.fillStyle='rgba(200,240,248,.12)'; ctx.fill(); ctx.restore(); });
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [reduced, highContrast]);
  return <canvas id="bgCanvas" ref={ref} />;
}

/* ============================ CONFETTI ============================ */
function Confetti({ go }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!go) return;
    const cols = ['#ffd700','#ff6b6b','#00b4b4','#7fd7e8','#22c55e','#c8f0f8'];
    const p = Array.from({length:40}, (_,i) => ({ id:i+Math.random(), left:Math.random()*100, bg:cols[i%cols.length], delay:Math.random()*0.4, rot:Math.random()*360, round:Math.random()<0.5 }));
    setPieces(p);
    const tm = setTimeout(()=>setPieces([]), 2000);
    return ()=>clearTimeout(tm);
  }, [go]);
  return pieces.map(p => <div key={p.id} className="confetti-piece" style={{ left:p.left+'%', top:'-20px', background:p.bg, animationDelay:p.delay+'s', transform:`rotate(${p.rot}deg)`, borderRadius: p.round?'50%':'2px' }} />);
}

/* ============================ MATCHING ============================ */
function matchTier(said, target) {
  if (!said) return 'silence';
  const s = said.toLowerCase().trim();
  const t = String(target).toLowerCase().trim();
  if (s === t) return 'exact';
  if (s.includes(t) || t.includes(s)) return 'close';
  const tWords = t.split(/\s+/);
  if (tWords.some(w => w.length>2 && s.includes(w))) return 'close';
  if (t.length>=3 && s.length>=2 && s.slice(0,3)===t.slice(0,3)) return 'close';
  return 'any';
}

/* ============================ SHARED MIC PANEL ============================ */
function MicPanel({ st, prompt, onResult, onSkip, pecsCards }) {
  const { available, listen, micError } = useSpeech();
  const [phase, setPhase] = useState('idle');
  const start = () => {
    playListening(); setPhase('ready');
    setTimeout(() => { setPhase('listening'); listen(said=>onResult(said), ()=>setPhase('idle')); }, 600);
  };
  const usePecs = st.pecsMode || !available;
  return (
    <div className="center" style={{gap:16}}>
      <div className="speech-bubble">{prompt}</div>
      {!usePecs && phase==='idle' && <button className="mic-btn" onClick={start}>🎤</button>}
      {phase==='ready' && <div className="badge" style={{fontSize:22,padding:'18px 30px'}}>Get ready… 🎤</div>}
      {phase==='listening' && (
        <div className="center" style={{gap:10}}>
          <button className="mic-btn listening">🎤</button>
          <div className="waveform">{[0,1,2,3,4,5,6].map(i=><span key={i} style={{animationDelay:(i*0.1)+'s'}} />)}</div>
          <div className="muted">I'm listening… go ahead!</div>
        </div>
      )}
      {usePecs && (
        <div className="pecs-grid">
          {pecsCards.map((c,i) => (
            <div key={i} className="pecs-card" style={c.style} onClick={()=>{playTap();onResult(c.word);}}>
              {c.emoji && <span className="pe">{c.emoji}</span>}<span className="pl">{c.label||c.word}</span>
            </div>
          ))}
        </div>
      )}
      {micError && <div className="mic-error">{micError}</div>}
      <button className="btn ghost" onClick={onSkip}>Skip / Next →</button>
    </div>
  );
}

  useEffect(() => { document.body.classList.toggle('high-contrast', st.highContrast); document.body.classList.toggle('no-anim', st.sensoryMode); }, [st.highContrast, st.sensoryMode]);

  return (
    <div className={"app-root"+(st.highContrast?' high-contrast':'')}>
      <OceanBackground reduced={st.sensoryMode} highContrast={st.highContrast} />
      <div className="layer">

        {screen==='parent' && <ParentDashboard st={st} update={update} onExit={()=>setScreen(st.setupDone?'world':'welcome')} onTherapist={()=>setScreen('therapist')} />}

  );
}

/* ============================ STAGE / PROGRESS LOGIC ============================ */
function recordAttempt(update, { word, success, modality='speech', activity }) {
  update(prev => {
    const next = {...prev};
    next.totalAttempts = (prev.totalAttempts||0) + 1;
    next.stageProgress = {...prev.stageProgress};
    next.stageProgress.attempts = (prev.stageProgress.attempts||0)+1;
    if (!next.stageProgress.activities.includes(activity)) next.stageProgress.activities = [...next.stageProgress.activities, activity];
    const wa = prev.wordsAttempted.map(w=>({...w}));
    let entry = wa.find(w => w.word===word);
    if (!entry) { entry = { word, count:0, successes:0, modality, date:today() }; wa.push(entry); }
    entry.count++; entry.modality = modality;
    if (success) { entry.successes++; next.stageProgress.successes=(prev.stageProgress.successes||0)+1; }
    next.wordsAttempted = wa;
    if (success && entry.successes>=3 && !prev.wordsMastered.find(m=>m.word===word)) {
      next.wordsMastered = [...prev.wordsMastered, { word, date:today() }];
      next.wordsAttempted = wa.filter(w=>w.word!==word);
      const ml = [...prev.milestones];
      if ((prev.wordsMastered||[]).length===0) ml.push({label:"First word mastered: "+word, date:today()});
      next.milestones = ml;
    }
    return next;
  });
}
function maybeAdvanceStage(update) {
  update(prev => {
    const sp = prev.stageProgress;
    const opp = sp.attempts||0, succ = sp.successes||0;
    const ratioOk = opp>=5 && succ/opp >= 0.6;
    const sessionsOk = (sp.sessions||0) >= 2;
    const actsOk = (sp.activities||[]).length >= 2;
    if (ratioOk && sessionsOk && actsOk && prev.stage < 6) {
      const newStage = prev.stage + 1;
      const next = {...prev, stage:newStage, stageProgress:{attempts:0,successes:0,sessions:0,activities:[]}};
      next.milestones = [...prev.milestones, {label:"Reached Stage "+newStage+": "+STAGES[newStage-1].name, date:today()}];
      const zu = [...prev.zonesUnlocked];
      ZONES.forEach(z => { if (z.stage>0 && z.stage<=newStage && !zu.includes(z.id)) zu.push(z.id); });
      next.zonesUnlocked = zu;
      return next;
    }
    return prev;
  });
}
function grantReward(update) {
  let granted = null;
  update(prev => {
    const have = new Set(prev.aquarium.map(a=>a.type));
    const pool = REWARD_POOL.filter(r=>!have.has(r.type));
    if (!pool.length) return prev;
    granted = pool[Math.floor(Math.random()*pool.length)];
    return {...prev, aquarium:[...prev.aquarium, {...granted, date:today()}], _sessionRewards:(prev._sessionRewards||0)+1};
  });
  return granted;
}

/* ============================ WORLD ============================ */
function World({ st, update, game, setGame, goParent }) {
  const [companionMsg, setCompanionMsg] = useState("");
  const [showAquarium, setShowAquarium] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [rewardModal, setRewardModal] = useState(null);
  const limitSec = st.sessionTimeLimit*60;
  const sessionStarted = useRef(false);
  const goodbyeSaid = useRef(false), warnSaid = useRef(false);

  useEffect(() => {
    if (sessionStarted.current) return;
    sessionStarted.current = true;
    update(prev => ({...prev, totalSessions:(prev.totalSessions||0)+1, stageProgress:{...prev.stageProgress, sessions:(prev.stageProgress.sessions||0)+1}, lastSessionDate:today(), _sessionRewards:0}));
    const last = (st.sessionHistory||[]).slice(-1)[0];
    const greet = st.personality==='calm' ? "I'm so happy to see you." : st.personality==='adventurous' ? "Ready for an adventure?" : "Yay, you're here!";
    let msg = `Hi ${st.childName}! 👋 ${greet}`;
    if (last && last.summary) msg = `Welcome back, ${st.childName}! 🌊 Last time, ${last.summary} ${greet}`;
    setCompanionMsg(msg);
    setTimeout(()=>speak(msg,{male:st.voiceMale}), 500);
  }, []);

  useEffect(() => { const id = setInterval(()=>setElapsed(e=>e+1), 1000); return ()=>clearInterval(id); }, []);
  useEffect(() => {
    if (elapsed === limitSec-300 && !warnSaid.current) { warnSaid.current=true; const m=`Five more minutes, ${st.childName}! Let's have some fun!`; setCompanionMsg(m); speak(m,{male:st.voiceMale}); }
    if (elapsed >= limitSec && !goodbyeSaid.current) {
      goodbyeSaid.current = true;
      const m = `Great work today, ${st.childName}! 🌟 Time for a rest. See you next time!`;
      setCompanionMsg(m); speak(m,{male:st.voiceMale}); endSession();
    }
  }, [elapsed]);

  function endSession() {
    update(prev => {
      const sp = prev.stageProgress;
      const summary = `you played and tried ${sp.attempts||0} words!`;
      const hist = [...(prev.sessionHistory||[]), { date:today(), duration:Math.max(1,Math.round(elapsed/60)), attempts:sp.attempts||0, successes:sp.successes||0, stage:prev.stage, rewards: prev._sessionRewards||0, summary }];
      return {...prev, sessionHistory:hist, lastSessionSummary:summary};
    });
    maybeAdvanceStage(update);
  }

  const fmtTime = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const nearLimit = elapsed >= limitSec-300;

  const onGameReward = useCallback(() => {
    const r = grantReward(update);
    playReward();
    if (r) { setRewardModal(r); const m = `Wow! You unlocked ${r.name}! 🎉`; setTimeout(()=>speak(m,{male:st.voiceMale}),300); }
  }, [update, st.voiceMale]);

  const onGameDone = useCallback(() => {
    maybeAdvanceStage(update);
    setGame(null);
    const m = st.personality==='calm' ? "That was lovely. What shall we do now?" : "That was so much fun! Pick something else!";
    setCompanionMsg(m); speak(m,{male:st.voiceMale});
  }, [update, st.personality, st.voiceMale]);

  if (showAquarium) return <Aquarium st={st} onBack={()=>setShowAquarium(false)} />;
  if (game) { const GameComp = GAME_MAP[game]; return <GameComp st={st} update={update} onReward={onGameReward} onDone={onGameDone} onExit={()=>setGame(null)} />; }

  const band = st.ageBand;
  let nav = [
    {id:'feed',e:'🐬',l:'Feed'},{id:'pop',e:'🫧',l:'Pop'},{id:'find',e:'🐢',l:'Find'},
    {id:'name',e:'🦑',l:'Name'},{id:'count',e:'🐚',l:'Count'},{id:'colour',e:'🎨',l:'Colour'},{id:'speak',e:'🎤',l:'Speak'},
  ];
  if (band>=2) nav = [...nav, {id:'story',e:'🌊',l:'Story'},{id:'whale',e:'🐳',l:'Help'}];
  if (band>=3) nav = [...nav, {id:'scenario',e:'🎭',l:'Scenario'}];
  nav.push({id:'parent',e:'🔒',l:'Parent'});

  const handleNav = (id) => { playTap(); if (id==='parent') return goParent(); setGame(id); };

  return (
    <div style={{minHeight:'100vh'}}>
      <div className="topbar">
        <div className="badge">Hi {st.childName}! 👋</div>
        <div className={"badge"+(nearLimit?' warn':'')}>⏱ {fmtTime(elapsed)} / {st.sessionTimeLimit}:00</div>
        <div className="badge" onClick={()=>{playTap();setShowAquarium(true);}} style={{cursor:'pointer'}}>🐟 {st.aquarium.length} friends</div>
      </div>
      <div className="center" style={{minHeight:'100vh', padding:'80px 16px 120px', justifyContent:'flex-end', gap:20}}>
        <div className="speech-bubble" style={{marginBottom:8}}>{companionMsg}</div>
        <div className="companion" onClick={()=>{playTap();speak(companionMsg,{male:st.voiceMale});}}>{COMPANIONS[st.companionType]||'🐢'}</div>
        <div className="muted">{st.companionName} • Stage {st.stage}: {STAGES[st.stage-1].name}</div>
      </div>
      <div className="navbar">{nav.map(n => <button key={n.id} className="nav-btn" onClick={()=>handleNav(n.id)}><span className="ne">{n.e}</span>{n.l}</button>)}</div>
      {rewardModal && (
        <div className="center" style={{position:'fixed',inset:0,background:'rgba(6,20,40,.92)',zIndex:40,padding:24}} onClick={()=>setRewardModal(null)}>
          <Confetti go={true} />

            <div style={{fontSize:90}}>{rewardModal.emoji}</div>

  );
}

/* ============================ GAME SHELL ============================ */
function GameShell({ title, emoji, children, onExit, companionLine, st }) {
  useEffect(()=>{ if(companionLine) setTimeout(()=>speak(companionLine,{male:st.voiceMale}),300); },[companionLine]);
  return (
    <div style={{minHeight:'100vh'}}>
      <div className="topbar">
        <button className="btn ghost" style={{minHeight:48,padding:'8px 18px'}} onClick={()=>{playTap();onExit();}}>← Back</button>
        <div className="badge">{emoji} {title}</div>
        <div style={{width:80}} />
      </div>
      <div className="scroll-pad center" style={{justifyContent:'flex-start', minHeight:'100vh', paddingTop:80}}>{children}</div>
    </div>
  );
}

function useGameFlow(st, update, onReward, activity, totalRounds) {
  const [round, setRound] = useState(0);
  const [done, setDone] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const handleTier = (tier, word) => {
    const success = tier==='exact' || tier==='close';
    recordAttempt(update, { word, success, modality: st.pecsMode?'touch':'speech', activity });
    let line;
    if (tier==='exact') { line = `Perfect! You said "${word}"! 🎉`; playCelebration(); setConfetti(true); }
    else if (tier==='close') { line = `Great trying! That was so close! 🌟`; playCelebration(); setConfetti(true); }
    else if (tier==='any') { line = `Lovely sound! Let's try again. You can do it!`; playPop(); }
    else { line = `Let's try together. ${st.companionName} says it like this!`; }
    speak(line.replace(/[🎉🌟]/g,''), {male:st.voiceMale});
    setTimeout(()=>setConfetti(false), 1800);
    return { success, line };
  };
  const nextRound = () => { if (round+1 >= totalRounds) { setDone(true); onReward(); } else setRound(r=>r+1); };
  return { round, done, confetti, handleTier, nextRound, setDone };
}

function CompletePanel({ st, onDone, label }) {
  return (
    <div className="center" style={{gap:16}}>
      <div style={{fontSize:80}}>🏆</div>
      <div className="speech-bubble">{label||`Amazing work, ${st.childName}! You finished! 🎉`}</div>
      <button className="btn gold" style={{fontSize:22,minHeight:64}} onClick={()=>{playTap();onDone();}}>Done! 🌊</button>
    </div>
  );
}

function bankPecs(st, targetWord, targetEmoji) {
  const bank = WORD_BANKS[st.stage] || WORD_BANKS[1];
  const others = bank.filter(b=>b.word!==targetWord).sort(()=>Math.random()-0.5).slice(0,5).map(b=>({word:b.word,emoji:b.emoji}));
  return [{word:targetWord,emoji:targetEmoji||'⭐'}, ...others].sort(()=>Math.random()-0.5);
}

  const onResult = (said) => { const r = handleTier(matchTier(said,target.say), target.say); setFb(r.line); setTimeout(()=>{ setFb(""); nextRound(); }, 1900); };
  const cards = [{word:"left",label:"⬅️ left"},{word:"right",label:"➡️ right"},{word:"up",label:"⬆️ up"},{word:"down",label:"⬇️ down"}];
  return (
    <GameShell title="Help the Whale" emoji="🐳" onExit={onExit} st={st} companionLine={prompt}>
      <Confetti go={confetti} />
      {done ? <CompletePanel st={st} onDone={onDone} /> : (<>
        <div style={{fontSize:80}} className="companion">🐳</div>
        <div style={{fontSize:30}}>⬅️ ⬆️ ➡️ ⬇️</div>
        {fb && <div className="badge" style={{fontSize:18,padding:'12px 20px'}}>{fb}</div>}
        <div className="muted">Round {round+1} of {ROUNDS}</div>
        <MicPanel st={st} prompt={prompt} onResult={onResult} onSkip={()=>{setFb("");nextRound();}} pecsCards={cards} />
      </>)}
    </GameShell>
  );
}

/* ============================ GAME 7: COLOUR THE REEF ============================ */
function ColourGame({ st, update, onReward, onDone, onExit }) {
  const ROUNDS = 4;
  const colours = [{w:"red",c:"#ff6b6b"},{w:"blue",c:"#3b82f6"},{w:"green",c:"#22c55e"},{w:"yellow",c:"#ffd700"},{w:"purple",c:"#a855f7"},{w:"orange",c:"#fb923c"}];
  const elements = ["coral","seaweed","shell","fish"];
  const elEmoji = {coral:'🪸',seaweed:'🌿',shell:'🐚',fish:'🐟'};
  const { round, done, confetti, handleTier, nextRound } = useGameFlow(st, update, onReward, 'colour', ROUNDS);
  const [fills, setFills] = useState({});
  const [fb, setFb] = useState("");
  const element = elements[round % elements.length];
  let prompt = `What colour shall we make the ${element}? Say a colour!`;
  if (st.ageBand>=2 && round===1) prompt = `If we mix blue and yellow, what colour do we get? Say "green"!`;
  const onResult = (said) => {
    const matched = colours.find(c => said && said.toLowerCase().includes(c.w));
    const tier = matched ? 'exact' : (said ? 'any' : 'silence');
    const word = matched ? matched.w : (st.ageBand>=2&&round===1?'green':'colour');
    const r = handleTier(tier, word);
    if (matched) setFills(f=>({...f,[element]:matched.c}));
    setFb(r.line + (matched?` The ${element} is ${matched.w} now! 🎨`:'')); setTimeout(()=>{ setFb(""); nextRound(); }, 2000);
  };
  const cards = colours.map(c=>({word:c.w,label:c.w,style:{background:c.c,color:'#fff'}}));
  return (
    <GameShell title="Colour the Reef" emoji="🎨" onExit={onExit} st={st} companionLine={prompt}>
      <Confetti go={confetti} />
      {done ? <CompletePanel st={st} onDone={onDone} label={`Beautiful reef, ${st.childName}! 🎨🌊`} /> : (<>
        <div className="row" style={{justifyContent:'center', gap:16, fontSize:50}}>
          {elements.map(el => <span key={el} style={{filter:`drop-shadow(0 0 12px ${fills[el]||'transparent'})`, opacity: fills[el]?1:0.5, color:fills[el]}}>{elEmoji[el]}</span>)}
        </div>
        {fb && <div className="badge" style={{fontSize:16,padding:'12px 20px',maxWidth:420,textAlign:'center'}}>{fb}</div>}
        <div className="muted">Colouring the {element} • {round+1} of {ROUNDS}</div>
        <MicPanel st={st} prompt={prompt} onResult={onResult} onSkip={()=>{setFb("");nextRound();}} pecsCards={cards} />
      </>)}
    </GameShell>
  );
}

/* ============================ GAME 8: STORY TIME ============================ */
function StoryGame({ st, update, onReward, onDone, onExit }) {
  const TURNS = 5;
  const scenes = ["🐢🌊","🪸🐠","💎📦","🦈😮","🐙🤝"];
  const prompts = [
    "Once upon a time, a little turtle was exploring the deep ocean… What did the turtle see?",
    "The turtle swam past a colourful coral reef. Who did the turtle meet there?",
    "Then the turtle found a shiny treasure chest! What was inside?",
    "Suddenly, a big shape appeared in the water! What happened next?",
    "The friends all swam home together. How did the story end?"
  ];
  const [turn, setTurn] = useState(0);
  const [done, setDone] = useState(false);
  const [fb, setFb] = useState("");
  const [confetti, setConfetti] = useState(false);
  useEffect(()=>{ setTimeout(()=>speak(prompts[turn],{male:st.voiceMale}),400); },[turn]);
  const handle = (said) => {
    const has = !!said;
    recordAttempt(update, { word: "story turn "+(turn+1), success: has, modality: st.pecsMode?'touch':'speech', activity:'story' });
    const line = has ? `Ooh, ${said}! And then ${st.companionName} smiled and the story went on… 🌟` : `That's okay! ${st.companionName} says: and then something wonderful happened!`;
    setFb(line); if(has){ playCelebration(); setConfetti(true); } speak(line.replace(/[🌟]/g,''),{male:st.voiceMale});
    setTimeout(()=>{ setConfetti(false); setFb(""); if (turn+1>=TURNS) { setDone(true); onReward(); } else setTurn(t=>t+1); }, 2400);
  };
  const cards = [{e:'🐠',w:'a fish'},{e:'💎',w:'treasure'},{e:'🐙',w:'an octopus'},{e:'🦈',w:'a shark'},{e:'🪸',w:'coral'},{e:'⭐',w:'a star'}].map(c=>({word:c.w,emoji:c.e}));
  return (
    <GameShell title="Story Time" emoji="🌊" onExit={onExit} st={st}>
      <Confetti go={confetti} />
      {done ? <CompletePanel st={st} onDone={onDone} label={`What a wonderful story, ${st.childName}! 📖🌊`} /> : (<>
        <div style={{fontSize:64}}>{scenes[turn]}</div>
        {fb && <div className="badge" style={{fontSize:16,padding:'12px 20px',maxWidth:440,textAlign:'center'}}>{fb}</div>}
        <div className="muted">Story turn {turn+1} of {TURNS}</div>
        <MicPanel st={st} prompt={prompts[turn]} onResult={handle} onSkip={()=>{ if(turn+1>=TURNS){setDone(true);onReward();} else setTurn(t=>t+1); }} pecsCards={cards} />
      </>)}
    </GameShell>
  );
}

/* ============================ GAME 9: SOCIAL SCENARIO ============================ */

/* ============================ SPEAK (free practice) ============================ */
function SpeakGame({ st, update, onReward, onDone, onExit }) {
  const ROUNDS = 5;
  const bank = useMemo(()=>{ const b=[...(WORD_BANKS[st.stage]||WORD_BANKS[1])]; const cv=(st.customVocabulary||[]).map(w=>({word:w,emoji:'⭐'})); return [...cv,...b].sort(()=>Math.random()-0.5); },[st.stage]);
  const { round, done, confetti, handleTier, nextRound } = useGameFlow(st, update, onReward, 'speak', ROUNDS);
  const target = bank[round % bank.length];
  const [fb, setFb] = useState("");
  const level = st.communicationLevel;
  let prompt;
  if (level===1) prompt = `Can you say… ${target.word.toUpperCase()}? ${st.companionName} will say it first!`;
  else if (level===2) prompt = `It's a ___ . Can you say "${target.word}"?`;
  else if (level===3) prompt = `What do you see? Can you say "${target.word}"?`;
  else if (level===4) prompt = `Tell me about this! Try saying "${target.word}".`;
  else prompt = `Let's chat! Can you use "${target.word}" in a sentence?`;
  useEffect(()=>{ if(level===1) setTimeout(()=>speak(target.word,{male:st.voiceMale}),900); },[round]);
  const onResult = (said) => {
    let tier = matchTier(said, target.word);
    if (level===1 && tier==='any') tier='close';
    const r = handleTier(tier, target.word); setFb(r.line); setTimeout(()=>{ setFb(""); nextRound(); }, 1900);
  };
  const cards = bankPecs(st, target.word, target.emoji);
  return (
    <GameShell title="Speak Time" emoji="🎤" onExit={onExit} st={st} companionLine={prompt}>
      <Confetti go={confetti} />
      {done ? <CompletePanel st={st} onDone={onDone} /> : (<>
        <div style={{fontSize:90}} className="companion">{target.emoji}</div>
        {fb && <div className="badge" style={{fontSize:18,padding:'12px 20px'}}>{fb}</div>}
        <div className="muted">Word {round+1} of {ROUNDS} • Level {level}</div>
        <MicPanel st={st} prompt={prompt} onResult={onResult} onSkip={()=>{setFb("");nextRound();}} pecsCards={cards} />
      </>)}
    </GameShell>
  );
}

/* ============================ BAR CHART ============================ */
function BarChart({ data, labels, height=80, color='#00b4b4' }) {
  const ref = useRef(null);
  useEffect(()=>{
    const c = ref.current; if(!c) return; const ctx=c.getContext('2d');
    const W=c.width=c.clientWidth, H=c.height=height;
    ctx.clearRect(0,0,W,H);
    const max = Math.max(1,...data); const bw = W/data.length;
    data.forEach((v,i)=>{ const h=(v/max)*(H-16); const x=i*bw+bw*0.15, y=H-h-2, w=bw*0.7; ctx.fillStyle=color; if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();}else{ctx.fillRect(x,y,w,h);} });
  },[JSON.stringify(data),height,color]);
  return (
    <div>
      <canvas ref={ref} style={{width:'100%',height,display:'block'}} />
      {labels && <div className="row muted" style={{justifyContent:'space-between',fontSize:10,marginTop:2}}>{labels.map((l,i)=><span key={i} style={{flex:1,textAlign:'center'}}>{l}</span>)}</div>}
    </div>
  );
}

function ParentProgress({ st }) {

    <label className="fld"><span>Age: {st.childAge} ({BAND_NAMES[ageBandFor(st.childAge)]})</span><input type="range" min="3" max="10" value={st.childAge} style={{width:'100%'}} onChange={e=>update({childAge:+e.target.value, ageBand:ageBandFor(+e.target.value)})} /></label>
    <label className="fld"><span>Communication Level</span><select className="input" value={st.communicationLevel} onChange={e=>update({communicationLevel:+e.target.value})}>{[1,2,3,4,5].map(n=><option key={n} value={n}>Level {n}</option>)}</select></label>
    <h3 className="sub">Companion</h3>
    <label className="fld"><span>Companion name</span><input className="input" value={st.companionName} onChange={e=>update({companionName:e.target.value})} /></label>
    <div className="choice-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:14}}>{COMPANION_LIST.map(c=><button key={c.id} className={"emoji-card"+(st.companionType===c.id?' sel':'')} onClick={()=>update({companionType:c.id})}><span className="e">{c.emoji}</span><span className="l">{c.label}</span></button>)}</div>
    <label className="fld"><span>Session time limit</span><select className="input" value={st.sessionTimeLimit} onChange={e=>update({sessionTimeLimit:+e.target.value})}>{[15,20,30,45].map(m=><option key={m} value={m}>{m} minutes</option>)}</select></label>
    <h3 className="sub">Sensory & Modes</h3>
    <div className="card">
      <Toggle k="pecsMode" l="PECS mode (tap picture cards)" />
      <Toggle k="sensoryMode" l="Reduced animation / sensory mode" />
      <Toggle k="quietMode" l="Quiet mode (lower volume)" />
      <Toggle k="noSuddenSounds" l="No sudden sounds" />
      <Toggle k="highContrast" l="High contrast mode" />
    </div>
    <h3 className="sub">Export Data</h3>
    <textarea className="input" readOnly value={exportJson} onClick={e=>e.target.select()} />
    <h3 className="sub">Reset Progress</h3>
    <div className="card">
      <div className="muted">Type RESET to erase all data and start over.</div>
      <input className="input" style={{marginTop:8}} value={resetText} onChange={e=>setResetText(e.target.value)} placeholder="Type RESET" />
      <button className="btn coral" style={{marginTop:10,width:'100%'}} disabled={resetText!=='RESET'} onClick={()=>{ localStorage.removeItem(KEY); location.reload(); }}>Reset Everything</button>
    </div>
  </>);
}

function ParentCoaching({ st, update }) {
  const name = st.childName;
  const week = Math.floor(Date.now()/(7*864e5));
  const rotated = COACH_TIPS.map((_,i)=>COACH_TIPS[(i+week)%COACH_TIPS.length]);
  return (<>
    <div className="zone-banner">Tips for Communication Level {st.communicationLevel} • rotates weekly</div>
    {rotated.map((t,i)=>(
      <div className="tip-card" key={i} onClick={()=>{ if(!st.coachingTipsRead.includes(t.t)) update({coachingTipsRead:[...st.coachingTipsRead,t.t]}); }}>
        <div className="tt">{t.e} {t.t} {st.coachingTipsRead.includes(t.t)?'✓':''}</div>
        <div className="tb">{t.b.replace(/\[NAME\]/g,name)}</div>
      </div>
    ))}
  </>);
}

function ParentVocab({ st, update }) {
  const [word, setWord] = useState("");
  const add = () => { const w=word.trim().toLowerCase(); if(!w) return; if(!st.customVocabulary.includes(w)) update({customVocabulary:[...st.customVocabulary,w]}); setWord(""); playTap(); };
  const remove = (w) => update({customVocabulary:st.customVocabulary.filter(x=>x!==w)});
  const suggested = useMemo(()=>(WORD_BANKS[st.stage]||WORD_BANKS[1]).map(b=>b.word),[st.stage]);
  const masteredSet = new Set((st.wordsMastered||[]).map(m=>m.word));
  return (<>
    <h3 className="sub">Add Custom Target Word</h3>
    <div className="row"><input className="input" style={{flex:1}} value={word} onChange={e=>setWord(e.target.value)} placeholder="e.g. bubble" onKeyDown={e=>e.key==='Enter'&&add()} /><button className="btn" onClick={add}>Add</button></div>
    <h3 className="sub">Parent-Added Words ({st.customVocabulary.length})</h3>
    <div className="card">{st.customVocabulary.length? st.customVocabulary.map(w=><div key={w} className="row" style={{justifyContent:'space-between',padding:'4px 0'}}><span>⭐ {w} {masteredSet.has(w)?'✅ mastered':''}</span><button className="btn ghost" style={{minHeight:36,padding:'4px 12px',fontSize:13}} onClick={()=>remove(w)}>Remove</button></div>) : <span className="muted">No custom words yet</span>}</div>
    <h3 className="sub">System-Suggested (Stage {st.stage})</h3>
    <div className="card">{suggested.map(w=><div key={w}>💡 {w} {masteredSet.has(w)?'✅':((st.wordsAttempted||[]).find(a=>a.word===w)?'🔄':'')}</div>)}</div>
  </>);
}

/* ============================ THERAPIST DASHBOARD ============================ */
function TherapistDashboard({ st, update, onExit }) {
  const [tab, setTab] = useState('overview');
  const tabs = [['overview','Overview'],['goals','Goals'],['reports','Reports'],['activities','Activities'],['settings','Settings']];
  return (
    <div style={{minHeight:'100vh'}}>
      <div className="topbar">
        <button className="btn ghost" style={{minHeight:48,padding:'8px 18px'}} onClick={onExit}>← Parent</button>
        <div className="badge">🩺 Therapist Dashboard</div>
        <div style={{width:80}} />
      </div>
      <div className="scroll-pad">
        <div className="tabbar">{tabs.map(([k,l])=><button key={k} className={"tab"+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
        {tab==='overview' && <TherapistOverview st={st} />}
        {tab==='goals' && <TherapistGoals st={st} update={update} />}
        {tab==='reports' && <TherapistReports st={st} />}
        {tab==='activities' && <TherapistActivities st={st} update={update} />}
        {tab==='settings' && <TherapistSettings st={st} update={update} />}
      </div>
    </div>
  );
}

function TherapistOverview({ st }) {
  const days30 = Array.from({length:30},(_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-(29-i)); return dt.toISOString().slice(0,10); });
  const freq = days30.map(dd => (st.sessionHistory||[]).filter(s=>s.date===dd).length);
  const daysSince = st.lastSessionDate ? Math.floor((Date.now()-new Date(st.lastSessionDate))/864e5) : 999;
  const allWords = [...(st.wordsMastered||[]).map(m=>m.word), ...(st.wordsAttempted||[]).map(a=>a.word)];
  const mlu = allWords.length ? (allWords.reduce((a,w)=>a+String(w).split(/\s+/).length,0)/allWords.length).toFixed(2) : "0.00";
  const totalAtt = (st.wordsAttempted||[]).reduce((a,w)=>a+(w.count||0),0)+(st.wordsMastered||[]).length;
  const spontRate = totalAtt? Math.round(((st.wordsMastered||[]).length/totalAtt)*100) : 0;
  return (<>
    <div className="zone-banner">{st.childName}, age {st.childAge} • {BAND_NAMES[st.ageBand]}</div>
    {daysSince>=7 && <div className="mic-error">⚠️ No sessions in {daysSince===999?'a while':daysSince+' days'}. Consider re-engagement strategies.</div>}
    <div className="card" style={{margin:'12px 0'}}>
      <div style={{fontWeight:800}}>Stage {st.stage}: {STAGES[st.stage-1].name}</div>
      <div className="muted">Communication Level {st.communicationLevel}</div>
    </div>
    <div className="stat-grid">
      <div className="stat"><div className="v">{mlu}</div><div className="k">MLU Trend</div></div>
      <div className="stat"><div className="v">{st.stage}/6</div><div className="k">Stage</div></div>
      <div className="stat"><div className="v">{spontRate}%</div><div className="k">Mastery Rate</div></div>
      <div className="stat"><div className="v">{st.totalSessions||0}</div><div className="k">Total Sessions</div></div>
    </div>
    <h3 className="sub">Session Frequency (30 days)</h3>
    <div className="card"><BarChart data={freq} color="#00b4b4" /></div>
  </>);
}

function TherapistGoals({ st, update }) {
  const [d, setD] = useState({description:"",targetStage:st.stage,targetWords:"",deadline:""});
  const [showReport,setShowReport]=useState(false);
  const goals = st.therapistGoals||[];
  const masteredSet = new Set((st.wordsMastered||[]).map(m=>m.word));
  const addGoal = () => { if(!d.description.trim()) return; const g={id:Date.now(),description:d.description,targetStage:+d.targetStage,targetWords:d.targetWords.split(',').map(s=>s.trim()).filter(Boolean),deadline:d.deadline,notes:"",achieved:false}; update({therapistGoals:[...goals,g]}); setD({description:"",targetStage:st.stage,targetWords:"",deadline:""}); playTap(); };
  const upd = (id,patch) => update({therapistGoals:goals.map(g=>g.id===id?{...g,...patch}:g)});
  const del = (id) => update({therapistGoals:goals.filter(g=>g.id!==id)});
  const report = useMemo(()=> "INDIVIDUAL LEARNING PLAN\n========================\nChild: "+st.childName+" (age "+st.childAge+")\nCurrent Stage: "+st.stage+" ("+STAGES[st.stage-1].name+")\nTherapist: "+(st.therapistName||"—")+"\nReview date: "+(st.goalReviewDate||"—")+"\n\nGOALS:\n"+(goals.length?goals.map((g,i)=>{ const got=g.targetWords.filter(w=>masteredSet.has(w)).length; return (i+1)+". "+g.description+"\n   Target stage: "+g.targetStage+" | Deadline: "+(g.deadline||"—")+"\n   Target words: "+(g.targetWords.join(", ")||"—")+"\n   Progress: "+got+"/"+(g.targetWords.length||0)+" mastered\n   Status: "+(g.achieved?"ACHIEVED":"Active")+"\n   Notes: "+(g.notes||"—"); }).join("\n\n"):"(none)"), [JSON.stringify(goals),st.childName,st.therapistName,st.goalReviewDate]);
  return (<>
    <h3 className="sub">Add Goal (ILP)</h3>
    <div className="card">
      <label className="fld"><span>Description</span><input className="input" value={d.description} onChange={e=>setD({...d,description:e.target.value})} placeholder="e.g. Produce 10 two-word phrases" /></label>
      <label className="fld"><span>Target Stage</span><select className="input" value={d.targetStage} onChange={e=>setD({...d,targetStage:e.target.value})}>{STAGES.map(s=><option key={s.n} value={s.n}>Stage {s.n}: {s.name}</option>)}</select></label>
      <label className="fld"><span>Target Words (comma separated)</span><input className="input" value={d.targetWords} onChange={e=>setD({...d,targetWords:e.target.value})} placeholder="fish, blue fish, more" /></label>
      <label className="fld"><span>Deadline</span><input className="input" type="date" value={d.deadline} onChange={e=>setD({...d,deadline:e.target.value})} /></label>
      <button className="btn" style={{width:'100%'}} onClick={addGoal}>Add Goal</button>
    </div>
    <h3 className="sub">Current Term Goals ({goals.length})</h3>
    {goals.map(g=>{ const got=g.targetWords.filter(w=>masteredSet.has(w)).length; const pct=g.targetWords.length?Math.round(got/g.targetWords.length*100):(g.achieved?100:0); return (
      <div className="card" key={g.id} style={{marginBottom:12}}>
        <div style={{fontWeight:800}}>{g.description}</div>
        <div className="muted">Target Stage {g.targetStage} • Deadline {g.deadline||'—'}</div>
        <div className="progress-bar" style={{margin:'8px 0'}}><div style={{width:pct+'%'}} /></div>
        <div className="muted">{got}/{g.targetWords.length} target words mastered ({pct}%)</div>
        <textarea className="input" style={{marginTop:8,minHeight:60}} placeholder="Notes…" value={g.notes} onChange={e=>upd(g.id,{notes:e.target.value})} />
        <div className="row" style={{marginTop:8}}>
          <button className={"btn "+(g.achieved?'success':'ghost')} style={{minHeight:44}} onClick={()=>upd(g.id,{achieved:!g.achieved})}>{g.achieved?'✓ Achieved':'Mark Achieved'}</button>
          <div className="spacer" /><button className="btn coral" style={{minHeight:44}} onClick={()=>del(g.id)}>Delete</button>
        </div>
      </div>
    );})}
    {!goals.length && <div className="card muted">No goals yet. Add one above.</div>}
    <button className="btn gold" style={{width:'100%',marginTop:8}} onClick={()=>setShowReport(s=>!s)}>{showReport?'Hide Report':'Generate Report'}</button>
    {showReport && <textarea className="input" style={{marginTop:10,minHeight:240}} readOnly value={report} onClick={e=>e.target.select()} />}
  </>);
}

function TherapistReports({ st }) {
  const [from,setFrom]=useState(""); const [to,setTo]=useState("");
  const sessions = (st.sessionHistory||[]).filter(s=> (!from||s.date>=from) && (!to||s.date<=to));
  const text = useMemo(()=> "SESSION REPORT — "+st.childName+"\n"+"=".repeat(34)+"\n"+(sessions.length?sessions.map(s=>`${s.date} | ${s.duration}min | attempts:${s.attempts} successes:${s.successes} stage:${s.stage} rewards:${s.rewards}`).join("\n"):"(no sessions in range)"),[JSON.stringify(sessions),st.childName]);
  return (<>
    <h3 className="sub">Filter by Date</h3>
    <div className="row"><input className="input" type="date" value={from} onChange={e=>setFrom(e.target.value)} /><input className="input" type="date" value={to} onChange={e=>setTo(e.target.value)} /></div>
    <h3 className="sub">Sessions ({sessions.length})</h3>
    <div className="card" style={{overflowX:'auto'}}>
      <table className="rep">
        <thead><tr><th align="left">Date</th><th>Dur</th><th>Att</th><th>Succ</th><th>Stage</th><th>Rwd</th></tr></thead>
        <tbody>{sessions.map((s,i)=><tr key={i}><td>{s.date}</td><td align="center">{s.duration}m</td><td align="center">{s.attempts}</td><td align="center">{s.successes}</td><td align="center">{s.stage}</td><td align="center">{s.rewards}</td></tr>)}</tbody>
      </table>
      {!sessions.length && <div className="muted" style={{padding:8}}>No sessions in this range.</div>}
    </div>
    <h3 className="sub">Speech Attempt Breakdown</h3>
    <div className="card">{(st.wordsAttempted||[]).length||(st.wordsMastered||[]).length ? (<>{(st.wordsMastered||[]).map((m,i)=><div key={'m'+i}>✅ {m.word} (mastered)</div>)}{(st.wordsAttempted||[]).map((a,i)=><div key={'a'+i}>🔄 {a.word} — {a.successes}/{a.count} ({a.modality})</div>)}</>) : <span className="muted">No attempt data yet.</span>}</div>
    <h3 className="sub">Export Summary</h3>
    <textarea className="input" style={{minHeight:200}} readOnly value={text} onClick={e=>e.target.select()} />
  </>);
}

function TherapistActivities({ st, update }) {
  const [vocabName,setVocabName]=useState(""); const [vocabWords,setVocabWords]=useState("");
  const [scTitle,setScTitle]=useState(""); const [scLines,setScLines]=useState(["","","",""]);
  const acts = st.customActivities||[];
  const addVocab = () => { if(!vocabName.trim())return; update({customActivities:[...acts,{id:Date.now(),type:'vocab',name:vocabName,words:vocabWords.split(',').map(s=>s.trim()).filter(Boolean),assigned:false}]}); setVocabName("");setVocabWords("");playTap(); };
  const addScenario = () => { if(!scTitle.trim())return; update({customActivities:[...acts,{id:Date.now(),type:'scenario',title:scTitle,lines:scLines.map(l=>l||"...")}]}); setScTitle("");setScLines(["","","",""]);playTap(); };
  const assign = (id) => { const set=acts.find(a=>a.id===id); update({customActivities:acts.map(a=>a.type==='vocab'?{...a,assigned:a.id===id}:a), customVocabulary:[...new Set([...(st.customVocabulary||[]),...set.words])]}); };
  const del = (id) => update({customActivities:acts.filter(a=>a.id!==id)});
  return (<>
    <h3 className="sub">Custom Vocabulary Set</h3>
    <div className="card">
      <label className="fld"><span>Set name</span><input className="input" value={vocabName} onChange={e=>setVocabName(e.target.value)} placeholder="e.g. Mealtime words" /></label>
      <label className="fld"><span>Words (comma separated)</span><input className="input" value={vocabWords} onChange={e=>setVocabWords(e.target.value)} placeholder="spoon, cup, more, all done" /></label>
      <button className="btn" style={{width:'100%'}} onClick={addVocab}>Save Set</button>
    </div>
    {acts.filter(a=>a.type==='vocab').map(a=><div className="card" key={a.id} style={{marginBottom:10}}><div style={{fontWeight:800}}>{a.name} {a.assigned?'✅ assigned':''}</div><div className="muted">{a.words.join(', ')}</div><div className="row" style={{marginTop:8}}><button className="btn ghost" style={{minHeight:42}} onClick={()=>assign(a.id)}>Assign to {st.childName}</button><div className="spacer"/><button className="btn coral" style={{minHeight:42}} onClick={()=>del(a.id)}>Delete</button></div></div>)}
    <h3 className="sub">Custom Scenario Script</h3>
    <div className="card">
      <label className="fld"><span>Title</span><input className="input" value={scTitle} onChange={e=>setScTitle(e.target.value)} placeholder="e.g. Going to the dentist" /></label>
      {scLines.map((l,i)=><label className="fld" key={i}><span>Line {i+1} (use [CHILD] for name)</span><input className="input" value={l} onChange={e=>{const n=[...scLines];n[i]=e.target.value;setScLines(n);}} /></label>)}
      <button className="btn" style={{width:'100%'}} onClick={addScenario}>Save Scenario</button>
    </div>
    {acts.filter(a=>a.type==='scenario').map(a=><div className="card" key={a.id} style={{marginBottom:10}}><div style={{fontWeight:800}}>🎭 {a.title}</div>{a.lines.map((l,i)=><div className="muted" key={i}>{i+1}. {l}</div>)}<button className="btn coral" style={{minHeight:42,marginTop:8}} onClick={()=>del(a.id)}>Delete</button></div>)}
    <div className="muted" style={{marginTop:8}}>Saved scenarios appear in the child's Social Scenario game.</div>
  </>);
}

function TherapistSettings({ st, update }) {
  return (<>
    <label className="fld"><span>Therapist Name (for reports)</span><input className="input" value={st.therapistName} onChange={e=>update({therapistName:e.target.value})} placeholder="e.g. Dr. Rivera, SLP" /></label>
    <label className="fld"><span>Goal Review Date</span><input className="input" type="date" value={st.goalReviewDate||""} onChange={e=>update({goalReviewDate:e.target.value})} /></label>
    <label className="fld"><span>Clinical Notes</span><textarea className="input" style={{minHeight:180}} value={st.therapistNotes} onChange={e=>update({therapistNotes:e.target.value})} placeholder="Free-text clinical notes (saved locally)…" /></label>
    <div className="muted">All therapist data is stored locally on this device only.</div>
  </>);
}

/* ============================ ERROR BOUNDARY ============================ */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  componentDidCatch(e, info) { console.error('Oral render error:', e, info); }
  render() {
    if (this.state.err) {
      return (
        <div style={{position:'fixed',inset:0,background:'#061428',color:'#ff6b6b',padding:32,fontFamily:'monospace',fontSize:14,overflow:'auto',zIndex:9999}}>
          <div style={{fontSize:32,marginBottom:16}}>🌊 Oral — Something went wrong</div>
          <div style={{color:'#7fd7e8',marginBottom:8}}>Error: {String(this.state.err.message||this.state.err)}</div>
          <div style={{color:'#a0c0d0',marginBottom:24,fontSize:12}}>{String(this.state.err.stack||'').slice(0,600)}</div>
          <button onClick={()=>{ localStorage.removeItem('oral_v2'); window.location.reload(); }}
            style={{padding:'12px 24px',background:'#00b4b4',color:'#fff',border:'none',borderRadius:12,fontSize:16,cursor:'pointer',marginRight:12}}>
            Reset &amp; Reload
          </button>
          <button onClick={()=>window.location.reload()}
            style={{padding:'12px 24px',background:'#0a3d6b',color:'#fff',border:'none',borderRadius:12,fontSize:16,cursor:'pointer'}}>
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================ MOUNT ============================ */
ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
